<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Astrolabe Wiki</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Melvor Idle 2 look: charcoal panels with dark rims, parchment tag labels, green actions, gold coin. */
  :root {
    --night:#141a1f; --panel:#262626; --panel2:#2e2e2e; --row:#2a2a2a; --rim:#101010; --line:#3a3a3a;
    --text:#ecebe6; --dim:#a7a49b; --link:#8ec9ee; --parch:#e9dcbf; --ink:#2b2216; --green:#2f8a2f; --green2:#1e651e;
    --gold:#f0c348; --red:#c8312b; --bad:#ec7f6c; --good:#8fd46f; --teal:#2f7f86;
    --head:"Fira Sans Condensed", "Arial Narrow", sans-serif; --body:"Fira Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:70px; }
  body { margin:0; color:var(--text); font:15px/1.5 var(--body);
    background:radial-gradient(1200px 500px at 70% -100px, #23435a55, transparent), linear-gradient(180deg, #172430 0, var(--night) 520px) fixed; background-color:var(--night); }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  img.ic { width:20px; height:20px; object-fit:contain; vertical-align:-5px; margin-right:5px; image-rendering:auto; }
  img.ic-l { width:40px; height:40px; object-fit:contain; vertical-align:middle; }
  img.ic-xl { width:72px; height:72px; object-fit:contain; }
  img.ic-hero { width:150px; height:150px; object-fit:contain; display:block; margin:6px auto 2px; }

  /* top bar */
  .top { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:18px; height:58px; padding:0 18px; background:#0e0e0e; border-bottom:2px solid #000; box-shadow:0 2px 0 #2b2b2b; }
  .brand { display:flex; align-items:center; gap:10px; font:800 21px/1 var(--head); color:var(--text); white-space:nowrap; }
  .brand:hover { text-decoration:none; }
  .brand .mark { width:32px; height:32px; object-fit:contain; }
  .topnav a img { width:20px; height:20px; object-fit:contain; vertical-align:-5px; margin-right:5px; }
  .brand small { font:500 13px var(--body); color:var(--dim); }
  .topnav { display:flex; gap:2px; min-width:0; overflow:hidden; }
  .topnav a { color:var(--text); font:600 15px var(--head); padding:6px 10px; border-radius:3px; white-space:nowrap; }
  .topnav a:hover { background:#222; text-decoration:none; }
  #q { flex:1; max-width:440px; margin-left:auto; height:34px; background:#1c1c1c; color:var(--text); border:1px solid #3c3c3c; border-radius:3px; padding:0 12px; font:inherit; }
  #results { position:fixed; top:56px; right:18px; width:min(560px, 94vw); max-height:70vh; overflow:auto; z-index:20; background:var(--panel); border:2px solid var(--rim); border-radius:4px; box-shadow:0 14px 40px #000c; }
  #results a { display:flex; align-items:center; gap:8px; padding:6px 12px; border-bottom:1px solid var(--line); color:var(--text); }
  #results a span:last-child { margin-left:auto; color:var(--dim); font-size:13px; }
  #results a:hover, #results a.sel { background:#333; text-decoration:none; }
  .back { color:var(--dim); font-size:14px; white-space:nowrap; }
  #menuBtn { display:none; background:#222; border:1px solid #444; color:var(--text); border-radius:3px; padding:4px 10px; font:inherit; }

  /* frame */
  .frame { display:grid; grid-template-columns:220px minmax(0,1fr); gap:0; max-width:1500px; margin:0 auto; }
  #side { position:sticky; top:60px; align-self:start; height:calc(100vh - 60px); overflow:auto; padding:16px 10px 30px 16px; scrollbar-width:thin; scrollbar-color:#444 transparent; }
  .sbox { background:var(--panel); border:2px solid var(--rim); box-shadow:inset 0 1px 0 #ffffff0d; border-radius:3px; padding:6px 6px 8px; margin-bottom:12px; }
  .sbox h4 { margin:-6px -6px 6px; padding:5px 10px; background:#1b1b1b; border-bottom:1px solid #000; font:700 14px var(--head); color:var(--dim); letter-spacing:.2px; }
  #side a { display:flex; align-items:center; padding:3px 6px; border-radius:2px; color:var(--text); font-size:14.5px; }
  #side a img.ic { width:18px; height:18px; vertical-align:middle; }
  #side a:hover { background:#333; text-decoration:none; }
  #side a.on { background:#3a3a3a; box-shadow:inset 3px 0 0 var(--gold); }
  #side .lv { margin-left:auto; color:var(--dim); font-size:12.5px; }
  .col { min-width:0; padding:16px 18px 0 8px; }
  main { position:relative; background:var(--panel); border:2px solid var(--rim); box-shadow:inset 0 1px 0 #ffffff12, 0 6px 24px #0007; border-radius:3px; padding:24px 30px 36px; min-height:70vh; }
  main::after { content:""; display:block; clear:both; }

  /* article */
  .page-title { display:flex; align-items:center; gap:12px; font:800 34px/1.1 var(--head); margin:0 0 6px; }
  .page-title img { width:44px; height:44px; object-fit:contain; }
  .crumbs { color:var(--dim); font-size:13.5px; margin:0 0 16px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .lead { font-size:16.5px; line-height:1.6; max-width:78ch; margin:0 0 14px; }
  main p { max-width:84ch; }
  /* section headings sit on a parchment tag, like the game's panel labels */
  main h3 { clear:none; margin:34px 0 12px; font:700 17px var(--head); }
  main h3 > span.tag { display:inline-block; background:var(--parch); color:var(--ink); padding:3px 14px 2px; border-radius:2px; box-shadow:0 2px 0 #0008, inset 0 -2px 0 #c9b88f; }
  main h3::after { content:""; display:block; height:1px; background:var(--line); margin-top:-12px; position:relative; z-index:-1; }
  main h4 { font:700 17px var(--head); margin:22px 0 8px; color:var(--parch); }
  .meta, .note { color:var(--dim); } .note { font-size:13.5px; }
  .muted { color:var(--dim); } .bad { color:var(--bad); } .good { color:var(--good); } .gold { color:var(--gold); }

  /* infobox */
  .infobox { float:right; clear:right; width:300px; margin:0 0 18px 24px; background:#1e1e1e; border:2px solid var(--rim); border-radius:3px; font-size:14px; box-shadow:0 4px 14px #0006; }
  .infobox .ib-title { background:var(--parch); color:var(--ink); font:800 18px/1.2 var(--head); text-align:center; padding:6px 10px; }
  .infobox .ib-sub { text-align:center; color:var(--dim); font-size:13px; margin:4px 0 2px; }
  .infobox table { width:100%; border:0; margin:6px 0 0; background:none; }
  .infobox th, .infobox td { border:0; border-top:1px solid #333; padding:5px 10px; background:none !important; font-size:13.5px; }
  .infobox th { width:42%; color:var(--dim); font-weight:500; }
  .infobox .ib-sec td { background:#151515 !important; color:var(--parch); font:700 14px var(--head); text-align:center; }

  /* contents */
  .toc { display:inline-block; min-width:230px; background:#1e1e1e; border:2px solid var(--rim); border-radius:3px; padding:8px 16px 10px; margin:4px 0 6px; font-size:14.5px; }
  .toc b { font-family:var(--head); }
  .toc ol { margin:4px 0 0; padding-left:20px; }

  /* tables */
  table { border-collapse:collapse; margin:8px 0 14px; background:var(--row); font-size:14.5px; border:2px solid var(--rim); }
  th, td { border:1px solid #3d3d3d; padding:5px 10px; text-align:left; vertical-align:middle; }
  th { background:#1a1a1a; color:var(--parch); font:600 14px var(--head); }
  tr:nth-child(even) td { background:#303030; }
  tbody tr:hover td, table tr:hover td { background:#373737; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  th.sortable { cursor:pointer; user-select:none; } th.sortable:hover { color:#fff; }
  td.best { color:var(--gold); font-weight:600; }
  .wide { width:100%; }
  td .sub, .sub { color:var(--dim); font-size:12.5px; }

  /* navigation box (main page) */
  .navbox { width:100%; border:2px solid var(--rim); margin:10px 0 18px; }
  .navbox .nb-title td { background:var(--parch) !important; color:var(--ink); text-align:center; font:700 15px var(--head); }
  .navbox th { width:130px; text-align:right; background:#1d1d1d; }
  .navbox td { background:var(--row) !important; line-height:2; }
  .navbox a { white-space:nowrap; margin-right:12px; }

  /* cards */
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:8px; margin:8px 0 6px; }
  .card { display:flex; align-items:center; gap:10px; background:#1e1e1e; border:2px solid var(--rim); border-radius:3px; padding:8px 10px; color:var(--text); box-shadow:inset 0 1px 0 #ffffff0a; }
  .card:hover { background:#2f2f2f; text-decoration:none; }
  .card b { display:block; font:700 16px var(--head); }
  .card span { color:var(--dim); font-size:12.5px; }

  /* filters */
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
  .chips a { background:#1d1d1d; border:2px solid var(--rim); color:var(--text); padding:3px 11px; border-radius:3px; font:600 14px var(--head); }
  .chips a.on { background:var(--green); border-color:var(--green2); color:#fff; box-shadow:inset 0 -2px 0 #0004; }
  .chips a:hover { text-decoration:none; filter:brightness(1.15); }
  .chip { display:inline-block; padding:0 8px; margin:0 6px 4px 0; border:1px solid #444; border-radius:10px; font-size:12.5px; color:var(--dim); }
  .mine, .ratebox, .calc { overflow:hidden; }
  .mine { background:#22351f; border:2px solid #14240f; padding:8px 14px; margin:10px 0; border-radius:3px; }
  .ratebox, .calc { background:#1e1e1e; border:2px solid var(--rim); border-radius:3px; padding:10px 14px; margin:10px 0; }
  .desc { font-style:italic; color:#d7d2c4; border-left:3px solid var(--parch); padding:2px 0 2px 12px; margin:12px 0; max-width:78ch; }
  .bonus { margin:1px 0; } .bonus .ctx { color:var(--dim); font-size:12.5px; }
  .tree { background:#1e1e1e; border:1px solid #111; padding:10px 14px; font-size:13.5px; }
  .tree .k { color:var(--dim); } .tree ul { margin:0; padding-left:18px; list-style:none; }
  details summary { cursor:pointer; color:var(--parch); margin:14px 0 6px; font:600 15px var(--head); }
  input, select { background:#1a1a1a; color:var(--text); border:1px solid #474747; border-radius:3px; padding:3px 8px; font:inherit; font-size:14.5px; }
  code { background:#1a1a1a; padding:0 5px; border-radius:3px; font-size:13.5px; }
  .linklist { columns:3 220px; column-gap:28px; margin:6px 0; padding:0; list-style:none; }
  .linklist li { break-inside:avoid; padding:1px 0; }
  .linklist .muted { font-size:12.5px; margin-left:4px; }
  .guide article { max-width:86ch; } .guide article li { margin:3px 0; }
  .guide article h2 { font:800 24px var(--head); margin:28px 0 10px; padding-bottom:4px; border-bottom:1px solid var(--line); }
  .guide article h2:first-child { display:none; }
  .twocol { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:0 26px; }
  footer { color:var(--dim); font-size:12.5px; padding:16px 4px 40px; }

  @media (max-width: 960px) {
    .frame { grid-template-columns:1fr; }
    #side { display:none; position:fixed; top:58px; left:0; width:250px; z-index:9; background:#141414; border-right:2px solid #000; }
    body.menu #side { display:block; }
    #menuBtn { display:block; } .topnav, .brand small, .back { display:none; }
    .col { padding:10px 6px 0; } main { padding:16px 14px 28px; }
    .infobox { float:none; width:100%; margin:8px 0 16px; }
    .page-title { font-size:28px; }
    main table { display:block; overflow-x:auto; }
  }

  /* ---- the game's own UI textures (img/Assets/UI/Textures), 9-sliced ---- */
  body { background:linear-gradient(#0b0f14d9, #0b0f14f2), url(img/Assets/Backgrounds/Bank/Banking_Night.webp) center top / cover fixed, var(--night); }
  main { border:14px solid transparent; border-image:url(img/Assets/UI/Textures/TEX_Crafting_14.webp) 28 fill / 14px stretch; background:none; box-shadow:none; padding:16px 22px 30px; }
  .sbox { border:10px solid transparent; border-image:url(img/Assets/UI/Textures/TEX_Crafting_14.webp) 28 fill / 10px stretch; background:none; box-shadow:none; padding:0 2px 4px; }
  .sbox h4 { margin:0 0 4px; background:none; border:0; padding:2px 4px 4px; border-bottom:1px solid #3a3a3a; color:var(--parch); }
  main h3 > span.tag { background:none; color:#fff; text-shadow:0 1px 0 #0009; padding:6px 22px 7px; border-radius:0; border:0 solid transparent; border-width:0 16px;
    border-image:url(img/Assets/UI/Textures/TEX_FrameHeader_1.webp) 0 30 fill / 0 16px stretch; box-shadow:none; }
  main h3::after { display:none; }
  .infobox { border:12px solid transparent; border-image:url(img/Assets/UI/Textures/Tooltips/TEX_Tooltip_Dark_Large.webp) 30 fill / 12px stretch; background:none; box-shadow:none; }
  .infobox .ib-title { background:none; color:#fff; padding:2px 6px 4px; border-bottom:1px solid #444; }
  .card, .toc, .ratebox, .calc { border:10px solid transparent; border-image:url(img/Assets/UI/Textures/Buttons/TEX_Button_Normal.webp) 20 fill / 10px stretch; background:none; padding:4px 8px; box-shadow:none; }
  .card:hover { border-image-source:url(img/Assets/UI/Textures/Buttons/TEX_Button_Hover.webp); background:none; }
  .chips a { border:8px solid transparent; border-image:url(img/Assets/UI/Textures/Buttons/TEX_Button_Normal.webp) 20 fill / 8px stretch; background:none; padding:0 6px; }
  .chips a.on { border-image-source:url(img/Assets/UI/Textures/Buttons/TEX_ActionButton_Normal.webp); background:none; box-shadow:none; }
  .chips a:hover { border-image-source:url(img/Assets/UI/Textures/Buttons/TEX_Button_Hover.webp); }
  .top { background:#0d0d0dee; }
  .ptree, .ptree ul { list-style:none; margin:4px 0; padding-left:18px; }
  .ptree { padding-left:0; } .ptree li { margin:3px 0; padding-left:10px; border-left:2px solid #3d3d3d; }
  .plan { border:10px solid transparent; border-image:url(img/Assets/UI/Textures/Buttons/TEX_Button_Normal.webp) 20 fill / 10px stretch; padding:2px 10px; margin:8px 0; }
  .btn { border:8px solid transparent; border-image:url(img/Assets/UI/Textures/Buttons/TEX_ActionButton_Normal.webp) 20 fill / 8px stretch; background:none; color:#fff; font:700 15px var(--head); padding:0 10px; cursor:pointer; }
  .btn:hover { filter:brightness(1.15); }
  .btn.alt { filter:saturate(.25) brightness(.9); } .btn.alt:hover { filter:saturate(.4); } .btn:disabled { opacity:.6; cursor:default; }
  .course-send .btn { margin:0 6px 6px 0; }
  .lvbox summary { margin:6px 0; }
  .lvgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:4px 14px; margin:6px 0 10px; }
  .lvgrid label { display:flex; align-items:center; gap:4px; font-size:14px; } .lvgrid input { width:58px; margin-left:auto; }
  /* search */
  #results a.all { justify-content:center; color:var(--link); font-weight:600; border-bottom:0; }
  .hit-why { display:block; color:var(--gold); font-size:12px; line-height:1.2; }
  /* hover cards */
  #hcard { position:fixed; z-index:30; width:300px; max-width:calc(100vw - 20px); pointer-events:none; font-size:13.5px; border:12px solid transparent; border-image:url(img/Assets/UI/Textures/Tooltips/TEX_Tooltip_Dark_Large.webp) 30 fill / 12px stretch; padding:2px 4px 4px; box-shadow:0 10px 30px #000a; }
  #hcard .hc-head { display:flex; gap:10px; align-items:center; margin-bottom:4px; }
  #hcard .hc-head b { display:block; font:700 16px/1.2 var(--head); } #hcard .hc-head span { color:var(--dim); font-size:12.5px; }
  #hcard table { width:100%; margin:4px 0; border:0; background:none; font-size:13px; }
  #hcard th, #hcard td { border:0; border-top:1px solid #3a3a3a; padding:2px 4px; background:none !important; }
  #hcard th { color:var(--dim); font:500 13px var(--body); }
  #hcard .hc-extra { border-top:1px solid #3a3a3a; padding-top:4px; } #hcard .desc { margin:4px 0; font-size:13px; }
  /* compare */
  .cmp-wrap { overflow-x:auto; }
  table.cmp { min-width:100%; } table.cmp thead th { vertical-align:top; min-width:170px; font:600 14px var(--body); }
  table.cmp tbody th { white-space:nowrap; } table.cmp .cmp-sec th { background:#151515; text-align:center; }
  td.best, table.cmp td.best { color:var(--gold); font-weight:600; }
  /* calculator */
  .calc-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 1fr)); gap:4px 14px; }
  .calc h4 { margin:2px 0 8px; }
  .calc-eq { display:grid; gap:5px; } .calc-eq label { display:flex; align-items:center; gap:8px; font-size:14px; }
  .calc-eq label span { width:64px; color:var(--dim); flex:none; } .calc-eq select { flex:1; min-width:0; width:0; }
  .calc-lv { grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); }
  .calc-pr label { display:flex; align-items:center; gap:6px; font-size:13.5px; padding:1px 0; }
  .calc-pr { max-height:320px; overflow:auto; }
  .stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:6px; margin:6px 0 10px; }
  .stat { background:#1b1b1b; border:1px solid #333; border-radius:3px; padding:6px 10px; }
  .stat span { display:block; color:var(--dim); font-size:12.5px; } .stat b { font:700 20px var(--head); font-variant-numeric:tabular-nums; }
  tr.dead td { color:var(--bad); }
  /* astrology map */
  .astro-ctl { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  .sky { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; margin:10px 0; padding:12px; border-radius:4px;
    background:radial-gradient(900px 400px at 30% 0, #26345a66, transparent), #0b0f1a; border:2px solid #000; }
  .con-head { display:flex; justify-content:space-between; align-items:baseline; gap:6px; padding:0 4px; }
  .con-head img.ic { width:16px; height:16px; margin:0 0 0 2px; vertical-align:-3px; }
  .con svg { width:100%; height:auto; display:block; }
  .con line { stroke:#8aa4d855; stroke-width:1.2; }
  .star circle { fill:#e8eeff; stroke:#9fb6ff; stroke-width:1.5; cursor:pointer; filter:drop-shadow(0 0 3px #9fb6ffaa); transition:opacity .15s; }
  .star.major circle { fill:var(--gold); stroke:#fff3c4; filter:drop-shadow(0 0 5px #f0c348cc); }
  .star.dim circle { opacity:.16; filter:none; }
  .star.owned circle { stroke:var(--good); stroke-width:3; }
  .star.sel circle, .star:focus-visible circle { stroke:#fff; stroke-width:3.5; } .star:focus { outline:none; }
  .star:hover circle { stroke:#fff; }
  #astroPick { position:sticky; bottom:8px; z-index:5; box-shadow:0 -6px 20px #000a; }
  #astroPick .x { float:right; background:none; border:0; color:var(--dim); font-size:22px; line-height:1; cursor:pointer; padding:0 4px; } #astroPick .x:hover { color:#fff; }
  table.chg td div { margin:1px 0; word-break:break-word; }

  @media (max-width: 960px) {
    .top { gap:8px; padding:0 8px; } #q { max-width:none; min-width:0; }
    #results { top:58px; left:6px; right:6px; width:auto; max-height:75vh; }
    .brand { font-size:18px; } .brand .mark { width:26px; height:26px; }
    main { border-width:10px; padding:10px 10px 22px; }
    .toc { display:block; }
    .calc-grid { grid-template-columns:1fr; }
    .stats { grid-template-columns:repeat(2, 1fr); }
    .sky { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); padding:6px; gap:4px; }
    .linklist { columns:2 150px; }
    .navbox th { width:auto; text-align:left; }
    table.navbox, table.navbox tbody, table.navbox tr, table.navbox th, table.navbox td { display:block; }
    input, select { font-size:16px; }   /* stops iOS zooming into fields */
    .lead { font-size:15.5px; }
  }
  @media (max-width: 520px) {
    .brand span, .brand { gap:6px; } .brand { font-size:0; } .brand .mark { width:30px; height:30px; }
    .page-title { font-size:24px; } .page-title img { width:34px; height:34px; }
    main table:not(.infobox table) { font-size:13.5px; }
    th, td { padding:4px 6px; }
  }
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" aria-label="Menu">Menu</button>
  <a class="brand" href="#/"><img class="mark" src="img/Assets/Icons/GuideBook.webp" alt="">Astrolabe<small>Melvor Idle 2 wiki, unofficial</small></a>
  <nav class="topnav" aria-label="Main">
    <a href="#/skills"><img src="img/Assets/Icons/Mastery_Icon_48.webp" alt="">Skills</a><a href="#/items"><img src="img/Assets/Icons/Bank_64.webp" alt="">Items</a><a href="#/monsters"><img src="img/Assets/Attack_32.webp" alt="">Monsters</a><a href="#/shop"><img src="img/Assets/Icons/Shop_64.webp" alt="">Shop</a><a href="#/money"><img src="img/Assets/Icons/StatsIcon_64.webp" alt="">Money</a><a href="#/guides"><img src="img/Assets/Icons/GuideBook.webp" alt="">Guides</a><a href="#/plan"><img src="img/Assets/Icons/Completion_64.webp" alt="">Planner</a><a href="#/mods"><img src="img/Assets/Icons/ModManager_64.webp" alt="">Mods</a>
  </nav>
  <input id="q" placeholder="Search the wiki (press /)" autocomplete="off" aria-label="Search">
  <a class="back" href="/">Astrolabe Tools</a>
</header>
<div id="results" hidden></div>
<div class="frame">
  <nav id="side" aria-label="Wiki navigation"></nav>
  <div class="col">
    <main id="main"><p class="muted">Loading game data...</p></main>
    <footer id="foot"></footer>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Game text uses BBCode-style tags: [b], [i], [color=#hex].
const bb = t => esc(t).replace(/\[color=(#[0-9a-fA-F]{3,8})\]/g, '<span style="color:$1">').replace(/\[\/color\]/g, '</span>').replace(/\[(\/?)(b|i|u)\]/g, '<$1$2>').replace(/\[\/?[a-z]+[^\]]*\]/g, '');
const fmt = n => typeof n === 'number' ? (Number.isInteger(n) ? n.toLocaleString() : (+n.toFixed(4)).toLocaleString()) : esc(n);
const bare = s => typeof s === 'string' ? s.replace(/^MelvorBase:/, '') : s;
const words = s => String(s).replace(/([a-z])([A-Z0-9])/g, '$1 $2').replace(/([A-Z])([A-Z][a-z])/g, '$1 $2');
const pct = x => x == null ? '' : (x * 100 >= 1 ? (x * 100).toFixed(x * 100 < 10 ? 2 : 1) : (x * 100).toPrecision(2)) + '%';

let DB, BANK = null, SKILLS = [], ENTITIES = new Set(), ASTRO = null;
const R = k => DB.records[k];
const href = k => '#/r/' + encodeURIComponent(k);
// Icons come from the game's own art (extracted by dump-assets.js + build); missing ones render nothing.
const imgBase = () => 'img/';
const iconPath = r => { const d = r?.d; const p = d && (d.Icon || d.Sprite || d.Media); return typeof p === 'string' ? p : null; };
function icon(p, cls = 'ic') { if (!p || !DB?.images || /missing_artwork/i.test(p)) return ''; const f = DB.images[String(p).replace(/^res:\/\//, '')]; return f ? `<img class="${cls}" src="${imgBase()}${f}" alt="" loading="lazy">` : ''; }
const recIcon = (k, cls) => icon(iconPath(R(k)), cls);
const skillIcon = (sk, cls) => icon(DB?.skillIcons?.[sk], cls);
const link = k => R(k) ? `<a href="${href(k)}">${recIcon(k)}${esc(R(k).n)}</a>` : esc(bare(k.split(':')[1] || k));
const itemKey = id => 'Item:' + id;
const typeLabel = t => words(t);

// Resolve a "MelvorBase:X" reference to a record key, preferring a type matching the field name.
function refKey(v, field) {
  const id = bare(v);
  const cands = DB.byId[id] || [];
  if (cands.length <= 1) return cands[0];
  const hint = (field || '').replace(/s$/, '');
  return cands.find(k => k.startsWith(hint + ':')) || cands.find(k => k.startsWith('Item:') && /Item|Product|Drop|Reward|Cost/.test(field || '')) || cands[0];
}

// ---------- bonus / modifier text ----------
// The game ships its own description templates for each stat; use them when one matches.
function numFmt(v, f) {
  const [pos, neg] = f.split(';');
  const pat = v < 0 && neg ? neg : pos;
  const isPct = pat.includes('%');
  const x = isPct ? v * 100 : v;
  const dec = (pat.split('.')[1] || '').replace(/[^0#]/g, '').length;
  let t = Math.abs(x).toLocaleString(undefined, { maximumFractionDigits: dec, minimumFractionDigits: (pat.split('.')[1] || '').replace(/[^0]/g, '').length });
  const sign = v < 0 ? '-' : pat.startsWith('+') ? '+' : '';
  return sign + t + (isPct ? '%' : '');
}
const msText = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 60000 ? +(a / 60000).toFixed(2) + ' min' : +(a / 1000).toFixed(3) + 's'); };
function modTemplate(b) {
  if (!DB?.mods) return null;
  if (b.StatGroup || b.Global) return DB.mods.global.find(g => g.StatGroup === (b.StatGroup || b.Global))?.TemplateString || null;
  const st = b.Stat?.StatsType, nm = b.Stat?.Name;
  if (!st || !nm) return null;
  const list = DB.mods.component.filter(m => m.Key.Stat.StatsType === st && m.Key.Stat.Name === nm);
  if (!list.length) return null;
  const have = Object.entries(b.LocalContext || {}).filter(([, x]) => x).map(([k]) => k).sort().join(',');
  const fromOk = m => !!m.Key.FromContextType === !!b.FromContext;
  return (list.find(m => fromOk(m) && [...m.Key.LocalContextObjectCombination].sort().join(',') === have) || list.find(fromOk) || list[0]).TemplateString;
}
function fillTemplate(t, b) {
  const v = b.Value;
  return t.replace(/\{([^}]*)\}/g, (_, tok) => {
    if (tok.startsWith('Value:')) {
      const f = tok.slice(6);
      if (f.startsWith('cond:')) { const [neg, pos] = f.slice(5).split('|'); return (v < 0 ? neg.split('?')[1] : pos.split('?')[1]) || ''; }
      if (f.startsWith('intervaltime') || f.startsWith('numbertime')) return msText(v);
      return numFmt(v, f);
    }
    const m = tok.match(/^(Loc(?:al)?|From)(?:Context)?\.?([A-Za-z]+)/);
    if (m) {
      const src = m[1] === 'From' ? (b.FromContext || {}) : (b.LocalContext || {});
      if (m[2] === 'Component') { const e = src.Component?.Entity; return e ? linkRef(e, 'Entity') : ''; }
      const x = src[m[2]];
      return x ? linkRef(x, m[2]) + (tok.endsWith('ResistanceName') ? ' resistance' : '') : '';
    }
    return fmt(v);
  }).replace(/\s{2,}/g, ' ').trim();
}
function bonusText(b) {
  const tpl = modTemplate(b);
  if (tpl) {
    const extra = [b.Condition ? 'conditional' : '', b.Scaling ? 'scales' : ''].filter(Boolean).join(' · ');
    return `<div class="bonus">${fillTemplate(tpl, b)}${extra ? ` <span class="ctx">(${extra})</span>` : ''}</div>`;
  }
  return bonusTextRaw(b);
}
function bonusTextRaw(b) {
  const name = b.Stat?.Name || bare(b.Stat) || '?';
  let v = b.Value;
  const isPct = /^Percent|Chance$|ChanceOn|DoublingChance|Preservation/.test(name);
  const isMs = /Interval$/.test(name) && !isPct;
  const shown = isPct ? (v >= 0 ? '+' : '') + (v * 100).toFixed(Math.abs(v * 100) < 1 ? 3 : 1).replace(/\.0+$/, '') + '%' : isMs ? (v >= 0 ? '+' : '') + v / 1000 + 's' : (v >= 0 ? '+' : '') + fmt(v);
  const ctx = b.LocalContext ? Object.entries(b.LocalContext).filter(([k, x]) => x && k !== 'Component').map(([k, x]) => `${words(k)}: ${linkRef(x, k)}`).join(', ') : '';
  const comp = b.LocalContext?.Component ? linkRef(b.LocalContext.Component.Entity, 'Entity') : '';
  const extra = [comp, ctx, b.Condition ? 'conditional' : '', b.Scaling ? 'scales' : ''].filter(Boolean).join(' · ');
  return `<div class="bonus"><b>${shown}</b> ${esc(words(name))} ${extra ? `<span class="ctx">(${extra})</span>` : ''}</div>`;
}
function bonusesHtml(bon) {
  if (!bon) return '';
  if (bon.Modifiers !== undefined) return bonusesHtml(bon.Modifiers);   // food: { Component: which skill, Modifiers }
  const arr = x => Array.isArray(x) ? x : [];
  const rows = [...arr(bon.Component), ...arr(bon.Global).map(g => ({ StatGroup: g.StatGroup, Stat: { Name: g.StatGroup }, Value: g.Value }))];
  return rows.map(bonusText).join('');
}
function linkRef(v, field) {
  if (typeof v !== 'string') return esc(JSON.stringify(v));
  if (v.startsWith('MelvorBase:') && ENTITIES.has(bare(v)) && !/Item|Recipe|Bonfire|Location|Area/.test(field || '')) return `<a href="#/skill/${bare(v)}">${skillIcon(bare(v))}${esc(bare(v))}</a>`;
  const k = v.startsWith('MelvorBase:') ? refKey(v, field) : null;
  return k ? link(k) : esc(bare(v));
}

// ---------- generic JSON tree ----------
const HIDE = /^(Icon|Media|Sprite|SpriteOffset|CoverBackground|LeafMedia|InvertedMedia|Background|ActionAudio|FailAudio|StepAudio|Audio)$/;
function tree(v, field, depth = 0) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '<span class="muted">none</span>';
  if (typeof v === 'string') return v.startsWith('res://') ? '<span class="muted">asset</span>' : linkRef(v, field);
  if (typeof v !== 'object') return `<b>${fmt(v)}</b>`;
  if (v.Stat && 'Value' in v && (v.LocalContext || v.Stat.Name)) return bonusText(v);
  if (Array.isArray(v)) {
    if (v.every(x => typeof x !== 'object')) return v.map(x => tree(x, field, depth + 1)).join(', ');
    return '<ul>' + v.map(x => `<li>${tree(x, field, depth + 1)}</li>`).join('') + '</ul>';
  }
  const entries = Object.entries(v).filter(([k, x]) => !HIDE.test(k) && x != null && x !== '' && !(Array.isArray(x) && !x.length));
  if (!entries.length) return '<span class="muted">none</span>';
  if (depth > 6) return '<span class="muted">...</span>';
  // compact one-liners for {Item, Quantity} style rows
  if (entries.length <= 4 && entries.every(([, x]) => typeof x !== 'object')) return entries.map(([k, x]) => `<span class="k">${esc(words(k))}:</span> ${tree(x, k, depth + 1)}`).join(' &nbsp; ');
  return '<ul>' + entries.map(([k, x]) => `<li><span class="k">${esc(words(bare(k)))}:</span> ${tree(x, k, depth + 1)}</li>`).join('') + '</ul>';
}

// ---------- requirement text ----------
function reqText(list) {
  return (list || []).map(q => {
    const d = q.Data || {}; const t = bare(q.Type);
    // Statistic requirements: "MiningItemGained" + Item Coal + 20000 -> "20,000 Coal gained from Mining".
    const subj = ['Item', 'Course', 'Event', 'Dungeon', 'Master', 'Enemy', 'Animal', 'Currency'].find(f => d[f]);
    const subjType = { Course: 'AgilityCourse', Event: 'AstrologyEvent', Master: 'SlayerMaster', Animal: R('RanchingAnimal:' + bare(d.Animal || '')) ? 'RanchingAnimal' : 'HuntingAnimal' };
    const stat = x => { const m = bare(x || '').match(/^(Woodcutting|Fishing|Mining|Thieving|Farming|Hunting|Cooking|Firemaking|Ranching|Agility|Astrology|Bank|Combat|Slayer|Enemy|Smithing|Crafting|Fletching|Herblore|Runecrafting|Beastcrafting)?(.*)$/);
      const what = words(m[2].replace(/Statistic$/, '')).toLowerCase(); return m[1] && !/^(Enemy|Bank|Combat|Slayer)$/.test(m[1]) ? `${what} (${m[1]})` : what; };
    const s = t === 'Level' ? `${linkRef(d.Component?.Entity, 'Entity')} level <b>${d.Level}</b>`
      : t === 'ToolbeltItemEquipped' || t === 'EquipmentItemEquipped' ? `${linkRef(d.Item, 'Item')} equipped`
      : t === 'ShopPurchase' ? `bought ${linkRef(d.ShopPurchase, 'ShopPurchase')}`
      : t === 'QuestComplete' ? `finished ${linkRef(d.Quest, 'Quest')}`
      : t === 'QuestStepActive' ? `on step ${(d.Step ?? 0) + 1} of ${linkRef(d.Quest, 'Quest')}`
      : t === 'QuestTaskGoalActive' ? `on ${linkRef(d.Quest, 'Quest')} step ${(d.Step ?? 0) + 1}, task ${(d.Task ?? 0) + 1}`
      : t === 'PetUnlocked' ? `found the pet ${linkRef(d.Pet, 'Pet')}`
      : t === 'AgilityTechniqueLevel' ? `${linkRef(d.Technique, 'AgilityTechnique')} technique level <b>${d.Level}</b>`
      : t === 'AgilityNumTechniquesLevel' ? `${d.NumTechniques} agility techniques at level <b>${d.Level}</b>`
      : t === 'AstrologyMajorNodeUnlocked' ? `unlocked ${linkRef(d.MajorNode, 'AstrologyNode')}`
      : t === 'HuntingMaxLevelAnimals' ? `${d.Count} hunting animal${d.Count > 1 ? 's' : ''} at journal level <b>${d.Level}</b>`
      : t === 'EquipmentSlotEquipped' ? `something in the ${esc(words(bare(d.Slot)))} slot`
      : t === 'ItemStatistic' && /ItemGained$/.test(bare(d.Statistic || '')) ? `<b>${fmt(d.Value)}</b> ${linkRef(d.Item, 'Item')} gained from ${esc(bare(d.Statistic).replace(/ItemGained$/, '') || 'actions')}`
      : /Statistic$/.test(t) && d.Value != null ? `<b>${fmt(d.Value)}</b> ${esc(stat(d.Statistic))}${subj ? ': ' + linkRef(d[subj], subjType[subj] || subj) : ''}`
      : `${esc(words(t))}: ${tree(d, '', 5)}`;
    return (d.IsOr ? 'or ' : '') + s;
  }).join('<br>');
}
function levelReq(rec, skill) {
  for (const q of rec.d.Requirements || []) if (bare(q.Type) === 'Level' && (!skill || bare(q.Data?.Component?.Entity) === skill)) return q.Data.Level;
  return rec.d.Level ?? null;
}

// ---------- item relation tables ----------
const qty = e => e.min == null ? '' : e.min === e.max ? fmt(e.min) : `${fmt(e.min)}-${fmt(e.max)}`;
const odds = e => [e.share != null ? pct(e.share) : '', e.chance != null && e.chance !== 1 ? pct(e.chance) : ''].filter(Boolean).join(' × ');
function relTable(list, cols) {
  if (!list?.length) return '<p class="muted">None.</p>';
  const rows = [...list].sort((a, b) => (R(a.from)?.t || '').localeCompare(R(b.from)?.t || '') || (R(a.from)?.n || '').localeCompare(R(b.from)?.n || ''));
  return `<table><tr><th>${cols}</th><th>Type</th><th>Skill</th><th>Via</th><th class="num">Qty</th><th class="num">Chance</th></tr>` +
    rows.map(e => { const r = R(e.from); return `<tr><td>${link(e.from)}</td><td class="muted">${typeLabel(r?.t)}</td><td>${r?.o ? `<a href="#/skill/${r.o}">${r.o}</a>` : ''}</td><td class="muted">${esc(words(e.path.split('.')[0]))}</td><td class="num">${qty(e)}</td><td class="num">${odds(e)}</td></tr>`; }).join('') + '</table>';
}

// ---------- wiki chrome: names, infobox, lead, contents, sidebar ----------
const TYPE_NAMES = { Item: 'Items', Enemy: 'Monsters', CombatArea: 'Combat areas', Dungeon: 'Dungeons', SlayerMaster: 'Slayer masters', Quest: 'Quests',
  ShopPurchase: 'Shop', Pet: 'Pets', NPC: 'NPCs', EquipmentSetBonus: 'Equipment sets', MagicSpell: 'Spells', Prayer: 'Prayers', MasteryGuildRank: 'Mastery guild ranks',
  MasteryGuildTask: 'Mastery guild tasks', AstrologyConstellation: 'Constellations', HuntingAnimal: 'Hunting animals', RanchingAnimal: 'Ranching animals', FarmingRecipe: 'Crops',
  ThievingRecipe: 'Thieving targets', AgilityCourse: 'Agility courses', Imbuement: 'Imbuements', CombatPassive: 'Monster passives', Attack: 'Monster attacks' };
const typeName = t => TYPE_NAMES[t] || words(t);
const SKILL_GROUPS = [
  ['Combat', ['Attack', 'Strength', 'Defence', 'Hitpoints', 'Ranged', 'Magic', 'Prayer', 'Slayer']],
  ['Gathering', ['Woodcutting', 'Fishing', 'Mining', 'Hunting', 'Thieving', 'Agility', 'Astrology']],
  ['Artisan', ['Firemaking', 'Cooking', 'Smithing', 'Fletching', 'Crafting', 'Runecrafting', 'Herblore', 'Beastcrafting']],
  ['Passive', ['Farming', 'Ranching']],
];
const groupOfSkill = sk => SKILL_GROUPS.find(g => g[1].includes(sk))?.[0];
const an = w => /^[aeiou]/i.test(w) ? 'an' : 'a';
const listJoin = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

function infobox(title, sub, rows) {
  const body = rows.filter(Boolean).map(r => r[0] === '§' ? `<tr class="ib-sec"><td colspan="2">${r[1]}</td></tr>` : r[1] === '' || r[1] == null ? '' : `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('');
  return `<aside class="infobox"><div class="ib-title">${esc(title)}</div>${sub ? `<div class="ib-sub">${sub}</div>` : ''}<table>${body}</table></aside>`;
}
const crumbs = parts => `<div class="crumbs">${parts.filter(Boolean).join(' / ')}</div>`;
const typeLink = t => `<a href="${typeHref(t)}">${esc(typeName(t))}</a>`;
const skillLink = sk => `<a href="#/skill/${sk}">${skillIcon(sk)}${esc(sk)}</a>`;

function itemKindPhrase(d) {
  const c = d.Capabilities || {};
  const eq = c['MelvorBase:Equipment'], tool = c['MelvorBase:Toolbelt'], wp = c['MelvorBase:Weapon'];
  if (wp) return `${an(words(bare(wp.Type || 'weapon')))} ${esc(words(bare(wp.Type || 'weapon')).toLowerCase())}`;
  if (eq) return `a piece of ${esc(words(bare(eq.Type)).toLowerCase())} equipment`;
  if (tool) { const ft = words(bare(tool.FitsInSlot)); return `${an(ft)} ${esc(ft.toLowerCase())} item for the toolbelt`; }
  if (c['MelvorBase:Food']) return 'a food';
  if (c['MelvorBase:Openable']) return 'a container you can open';
  if (c['MelvorBase:HuntingTrap']) return 'a hunting trap';
  if (c['MelvorBase:Compost']) return 'a compost';
  if (c['MelvorBase:FishingBait']) return 'a fishing bait';
  return 'an item';
}

// Contents box from the page's section headings.
function addToc() {
  const hs = [...$('main').querySelectorAll(':scope > h3')];
  hs.forEach((h, i) => h.id = 's' + i + '-' + h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40));
  if (hs.length < 3) return;
  const box = document.createElement('div');
  box.className = 'toc';
  box.innerHTML = `<b>Contents</b><ol>${hs.map(h => `<li><a href="javascript:void(0)" data-to="${h.id}">${esc(h.textContent)}</a></li>`).join('')}</ol>`;
  box.querySelectorAll('a').forEach(a => a.onclick = () => document.getElementById(a.dataset.to).scrollIntoView());
  hs[0].before(box);
}

function markSide() {
  const h = location.hash || '#/';
  $('side').querySelectorAll('a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === h));
}

// ---------- pages ----------
// Equipment sets an item belongs to (the game moved this out of item descriptions in v0.11.7).
let SETS_BY_ITEM = null;
function setsOf(id) {
  if (!SETS_BY_ITEM) { SETS_BY_ITEM = {}; for (const k of recsOf('EquipmentSetBonus')) for (const i of R(k).d.Items || []) (SETS_BY_ITEM[bare(i)] ||= []).push(k); }
  return SETS_BY_ITEM[id] || [];
}
function pageItem(k) {
  const r = R(k), d = r.d, rel = DB.itemRel[r.id] || { sources: [], uses: [], requiredBy: [] };
  const caps = d.Capabilities || {};
  const price = d.SellsFor ? `${fmt(d.SellsFor.Quantity)} ${linkRef(d.SellsFor.Currency, 'Currency')}` : 'cannot be sold';
  const have = BANK ? (BANK[r.id] ?? 0) : null;
  const eqc = caps['MelvorBase:Equipment'], tlc = caps['MelvorBase:Toolbelt'];
  const tagNames = (d.BankTags || []).map(t => esc(words(bare(t.BankTag))));
  let h = `<h2>${esc(r.n)}</h2>` + crumbs([typeLink('Item'), tlc ? `<a href="#/gear/${toolSkill(tlc)}">${esc(toolSkill(tlc))} gear</a>` : '', tagNames[0] || '']);
  h += infobox(r.n, tagNames.join(', '), [
    recIcon(k, 'ic-hero') && ['§', recIcon(k, 'ic-hero')],
    ['Sells for', price],
    ['Kind', esc(Object.keys(caps).map(c => words(bare(c))).join(', ')) || 'Material'],
    eqc && ['Equip slot', linkRef(eqc.Type, 'EquipmentType')],
    eqc?.Requirements?.length && ['Requires', reqText(eqc.Requirements)],
    tlc && ['Toolbelt slot', linkRef(tlc.FitsInSlot, 'ToolbeltSlotType')],
    tlc?.Requirements?.length && ['Requires', reqText(tlc.Requirements)],
    ['Sources', fmt(rel.sources.length)], ['Used in', fmt(rel.uses.length)],
    have !== null && ['In your bank', fmt(have)],
    ['Item ID', `<span class="muted">${esc(r.id)}</span>`],
    comparable(r) && ['Compare', `<a href="${compareAddHref(k)}">Compare with other gear</a>`],
  ]);
  const srcNames = [...new Set(rel.sources.map(e => R(e.from)?.n).filter(Boolean))];
  h += `<p class="lead"><b>${esc(r.n)}</b> is ${itemKindPhrase(d)}. ${d.SellsFor ? `It sells for ${fmt(d.SellsFor.Quantity)} ${esc(R('Currency:' + bare(d.SellsFor.Currency))?.n || 'gold')}.` : 'It cannot be sold.'}
    ${srcNames.length ? `You can get it from ${srcNames.length > 3 ? esc(srcNames.slice(0, 3).join(', ')) + `, and ${srcNames.length - 3} more` : esc(listJoin(srcNames))}.` : 'Nothing in the current game data produces it.'}
    ${rel.uses.length ? `It is used in ${rel.uses.length} recipe${rel.uses.length > 1 ? 's' : ''} and actions.` : ''}</p>`;
  if (d.Description) h += `<p class="desc">${bb(d.Description)}</p>`;
  if (have !== null) h += `<div class="mine">You have <b>${fmt(have)}</b> in your bank${have && d.SellsFor ? ` (worth ${fmt(have * d.SellsFor.Quantity)} gold)` : ''}.</div>`;
  h += personalItem(r.id);
  h += `<h3>Fastest way to get it</h3>` + itemPlanHtml(r.id, 1, true) + `<p class="note"><a href="#/plan/item/${r.id}/1">Open in the planner</a> to change the amount or your levels.</p>`;
  h += makersTable(r.id);
  const eq = eqc, tool = caps['MelvorBase:Toolbelt'], food = caps['MelvorBase:Food'], weapon = caps['MelvorBase:Weapon'];
  if (eq) {
    h += `<h3>Equipment stats</h3><table><tr><th>Slot type</th><td>${linkRef(eq.Type, 'EquipmentType')}${weapon ? ` · ${linkRef(weapon.Type, 'WeaponType')} · ${linkRef(weapon.DamageType, 'DamageType')}` : ''}</td></tr>`;
    if (eq.Requirements?.length) h += `<tr><th>Requires</th><td>${reqText(eq.Requirements)}</td></tr>`;
    for (const s of eq.Stats?.Stats || []) h += `<tr><th>${statName(s.Stat)}</th><td>${fmt(s.Value)}</td></tr>`;
    for (const s of eq.Stats?.PowerRatings || []) h += `<tr><th>Power rating (${esc(bare(s.DamageType))})</th><td>${fmt(s.Value)}</td></tr>`;
    for (const s of eq.Stats?.ProtectionRatings || []) h += `<tr><th>Protection rating (${esc(bare(s.DamageType))})</th><td>${fmt(s.Value)}</td></tr>`;
    h += '</table>' + bonusesHtml(eq.Bonuses);
  }

function refByHtml(r) {

const statName = id => { const k = 'CombatStat:' + bare(id); return R(k) ? esc(R(k).n) : esc(words(bare(id))); };
function dropRows(drops) {

    for (const x of t.Table || []) rows.push({ id: bare(x.Item), min: x.MinQuantity, max: x.MaxQuantity, p: t.Chance * x.Weight / total });

}
function dropTable(drops) {

}

// ---------- Personal layer (only when Astrolabe Tools is reading your save) ----------

}

let rateSort = { k: 'level', d: 1 };

function levelCalc(skill) {

function wireSkillPage(skill) {

// ---------- skill gear browser ----------
function pageGear(skill) {
  const types = {};

    if (!t?.FitsInSlot) continue;
    const ft = bare(t.FitsInSlot);
    if (!ft.startsWith(skill) || !/^[A-Z]/.test(ft.slice(skill.length))) continue;
    (types[ft] ||= []).push(k);
  }
  const slots = Object.values(DB.records).filter(r => r.t === 'ToolbeltSlot' && types[bare(r.d.FitsType)]);
  const slotInfo = ft => slots.filter(s => bare(s.d.FitsType) === ft).map(s => s.d.UnlockRequirements?.length ? `${esc(s.n)} <span class="muted">(${reqText(s.d.UnlockRequirements).replace(/<br>/g, '; ')})</span>` : esc(s.n)).join(', ');
  const order = ['Helmet', 'Torso', 'Legs', 'Boots', 'Gloves', 'Cape', 'Tool', 'Utility', 'Potion'];
  const keys = Object.keys(types).sort((a, b) => ((order.findIndex(o => a.endsWith(o)) + 1) || 99) - ((order.findIndex(o => b.endsWith(o)) + 1) || 99) || a.localeCompare(b));
  let h = `<h2>${esc(skill)} gear</h2>` + crumbs([skillLink(skill), 'Gear']) + `<p class="lead">Every skill has its own toolbelt. These are all the items that fit ${esc(skill)}'s slots, with what they do, what they need and where they come from.</p>`;
  for (const ft of keys) {

// ---------- guides (markdown) ----------
function md(src) {
  const inline = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
  const out = []; let list = 0;
  const close = to => { while (list > to) { out.push('</ul>'); list--; } };
  for (const line of src.split('\n')) {
    const li = line.match(/^(\s*)[-*] (.*)/);
    if (li) { const lvl = Math.floor(li[1].length / 2) + 1; while (list < lvl) { out.push('<ul>'); list++; } close(lvl); out.push(`<li>${inline(li[2])}</li>`); continue; }
    close(0);
    const hd = line.match(/^(#{1,4}) (.*)/);
    if (hd) { const id = hd[2].toLowerCase().replace(/[^a-z0-9]+/g, '-'); out.push(`<h${hd[1].length + 1} id="${id}">${inline(hd[2])}</h${hd[1].length + 1}>`); continue; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  close(0);
  return out.join('\n');
}
function pageGuide(name) {
  const g = DB.guides?.[name];
  if (!g) return `<h2>Not found</h2>`;
  const heads = [...g.matchAll(/^## (.*)/gm)].map(m => m[1]);
  return `<div class="guide"><nav class="toc">${heads.map(x => `<a href="javascript:void(0)" onclick="document.getElementById('${x.toLowerCase().replace(/[^a-z0-9]+/g, '-')}').scrollIntoView()">${esc(x)}</a>`).join('')}</nav><article>${md(g)}</article></div>`;
}

// The mechanics guide section for a skill, if there is one.
function skillMechanics(skill) {

  return sec ? sec.split('\n').slice(1).filter(l => !/^Sources?: /.test(l)).join('\n').replace(/\s*\(`[A-Z][\w./]*`(?:, `[\w./]+`)*\)/g, '') : '';
}
let typeSort = { k: 'n', d: 1 };
function typeTable(t, keys) {
  const cols = t === 'Item' ? [
    ['n', 'Name', r => r.n], ['sell', 'Sells', r => r.d.SellsFor?.Quantity ?? 0, 1],
    ['kind', 'Kind', r => Object.keys(r.d.Capabilities || {}).map(c => words(bare(c))).join(', ')],
    ['slot', 'Slot', r => words(bare(r.d.Capabilities?.['MelvorBase:Equipment']?.Type || r.d.Capabilities?.['MelvorBase:Toolbelt']?.FitsInSlot || ''))],
    ['src', 'Sources', r => DB.itemRel[r.id]?.sources.length ?? 0, 1], ['use', 'Used in', r => DB.itemRel[r.id]?.uses.length ?? 0, 1],
  ] : [
    ['n', 'Name', r => r.n],
    ...['Hitpoints', 'Attack', 'Strength', 'Defence', 'Ranged', 'Magic'].map(s => [s, s.slice(0, 3), r => (r.d.Levels || []).find(x => bare(x.Key) === s)?.Value ?? 0, 1]),
    ['spd', 'Speed', r => ((r.d.Stats?.Stats || []).find(x => bare(x.Stat) === 'AttackInterval')?.Value ?? 0) / 1000, 1],
    ['dt', 'Damage', r => bare(r.d.DamageType || '')], ['val', 'Gold/kill', r => enemyValue(r.d.Drops), 1],
  ];
  const col = cols.find(c => c[0] === typeSort.k) || cols[0];
  const rows = keys.map(k => ({ k, r: R(k), v: cols.map(c => c[2](R(k))) }));
  const i = cols.indexOf(col);
  rows.sort((a, b) => (typeof a.v[i] === 'string' ? a.v[i].localeCompare(b.v[i]) : a.v[i] - b.v[i]) * typeSort.d);
  return `<input id="tfilter" placeholder="Filter..." style="margin:4px 0 8px;width:260px" value="${esc(window._tf || '')}"><table class="ttable wide"><tr>${cols.map(c => `<th class="${c[3] ? 'num' : ''} sortable" data-tk="${c[0]}">${c[1]}${c === col ? (typeSort.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr>${rows.map(x =>
    `<tr data-s="${esc((x.r.n + ' ' + x.v.join(' ')).toLowerCase())}">${x.v.map((v, j) => j === 0 ? `<td>${link(x.k)}</td>` : `<td class="${cols[j][3] ? 'num' : 'muted'}">${typeof v === 'number' ? fmt(Math.round(v * 100) / 100) : esc(v)}</td>`).join('')}</tr>`).join('')}</table>`;
}
function enemyValue(drops) {
  const gold = (drops?.FixedCurrencies || []).filter(c => bare(c.Currency) === 'GoldPieces').reduce((s, c) => s + (c.MinQuantity + c.MaxQuantity) / 2, 0);
  return gold + dropRows(drops).reduce((s, x) => s + (x.min + x.max) / 2 * x.p * (R(itemKey(x.id))?.d.SellsFor?.Quantity ?? 0), 0);

const SORTS = {};
function dataTable(id, cols, rows, opts = {}) {
  const st = SORTS[id] || (SORTS[id] = { k: opts.sort ?? cols[0].k, d: opts.dir ?? 1 });
  const col = cols.find(c => c.k === st.k) || cols[0];

  rows = [...rows].sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? String(x).localeCompare(String(y)) : (x ?? -Infinity) - (y ?? -Infinity)) * st.d; });
  return `<table class="wide"><thead><tr>${cols.map(c => `<th class="${c.num ? 'num ' : ''}${c.v ? 'sortable' : ''}" ${c.v ? `data-tid="${id}" data-sk="${c.k}"` : ''}>${c.l}${c === col ? (st.d > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${rows.map(r =>
    `<tr${opts.rowAttr ? ' ' + opts.rowAttr(r) : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.h ? c.h(r) : fmt(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

    me && ['Your level', `${me.level} <span class="sub">(${fmt(Math.round(me.xp))} XP)</span>`],
  ]);
  h += `<p class="lead"><b>${esc(skill)}</b> is ${grp ? `${an(grp)} ${grp.toLowerCase()} skill` : 'a skill'}${rates.length ? ` with ${rates.length} actions, unlocking from level ${Math.min(...lv)} up to ${Math.max(...lv)}` : grp === 'Combat' ? ' trained by fighting monsters' : ''}.${slots.length ? ` It has its own toolbelt with ${slots.length} slots for gear, tools and potions.` : ''}</p>`;
  const mech = skillMechanics(skill);
  if (mech) h += `<h3>How it works</h3><div class="guide"><article>${md(mech)}</article></div>`;

  // Actions: one table with requirements, inputs, outputs and rates.
  const keys = Object.keys(DB.records).filter(k => DB.records[k].o === skill && /Recipe$|Animal$|Constellation$/.test(DB.records[k].t) && DB.records[k].t !== 'RanchingAnimal' || (skill === 'Ranching' && DB.records[k].t === 'RanchingAnimal'));
  if (keys.length) {
    const rows = keys.map(k => { const r = R(k), d = r.d, x = rateKey(skill, r.id);
      const t = d.BaseInterval ? d.BaseInterval / 1000 : d.BaseMinInterval ? `${d.BaseMinInterval / 1000}-${d.BaseMaxInterval / 1000}` : d.BasePreparingInterval ? (d.BasePreparingInterval + d.BaseHeatingInterval + d.BaseStirringInterval + d.BaseBottlingInterval) / 1000 : '';
      return { k, r, x, lvl: levelReq(r, skill) ?? x?.level ?? 0, t, quest: x?.area === 'Quests' || /Quest/.test(r.d.Category || '') }; });
    h += `<h3>Actions</h3><p class="note">Rates are at base: no gear, upgrades or mastery bonuses, with ingredients counted at sell price. Gold/hr is what the products sell for minus what the ingredients would.</p>` + filterBox('act_' + skill, 'Filter actions or items...') + dataTable('act_' + skill, [
      { k: 'lvl', l: 'Lvl', num: 1, v: o => o.lvl },
      { k: 'name', l: 'Action', v: o => o.r.n, h: o => `${link(o.k)}${o.quest ? ' <span class="chip">quest</span>' : ''}${o.x?.gate ? ` <span class="chip">needs ${gateText(o.x.gate)}</span>` : ''}${o.x?.area && o.x.area !== 'Quests' ? `<div class="sub">${esc(o.x.area)}</div>` : ''}` },
      { k: 'xp', l: 'XP', num: 1, v: o => o.r.d.BaseExperience ?? 0, h: o => fmt(o.r.d.BaseExperience ?? '') },
      { k: 't', l: 'Time', num: 1, v: o => parseFloat(o.t) || 0, h: o => (o.t ? o.t + 's' : '') + (o.r.d.Steps > 1 ? ` ×${o.r.d.Steps}` : '') },
      { k: 'in', l: 'Uses', h: o => (o.r.d.Ingredients?.Items || []).map(i => `${fmt(i.Quantity)} ${linkRef(i.Item, 'Item')}`).join('<br>') },
      { k: 'out', l: 'Makes', h: o => [...(o.r.d.Products || []), ...(o.r.d.Product ? [o.r.d.Product] : [])].map(p => `${p.Quantity != null ? fmt(p.Quantity) + ' ' : ''}${linkRef(p.Item, 'Item')}`).join('<br>') || (o.r.d.RandomProducts || []).map(p => linkRef(p.Item, 'Item')).join('<br>') },
      { k: 'xph', l: 'XP/hr', num: 1, v: o => o.x?.xp ?? 0, h: o => o.x ? fmt(o.x.xp) : '' },
      { k: 'gph', l: 'Gold/hr', num: 1, v: o => o.x?.gp ?? -1e12, h: o => o.x ? `<span class="${o.x.gp < 0 ? 'bad' : ''}">${fmt(o.x.gp)}</span>` : '' },
    ], rows, { sort: 'lvl' });
  }
  if (skill === 'Astrology') h += `<p class="note">See every node at once on the <a href="#/astrology">Astrology map</a>, filtered by skill or bonus.</p>` + astrologySections();
  if (grp === 'Combat') {
    h += `<h3>Training</h3><p>${esc(skill)} is trained by fighting. See <a href="#/monsters">monsters and combat areas</a> for every fight with what a kill is worth, and <a href="#/equipment">equipment</a> for gear by slot.</p>`;
    const extra = { Magic: 'MagicSpell', Prayer: 'Prayer', Slayer: 'SlayerMaster' }[skill];
    if (extra) h += `<h3>${esc(typeName(extra))}</h3>` + dataTable('extra_' + skill, [
      { k: 'lvl', l: 'Lvl', num: 1, v: k => lvlFor(R(k), skill) },
      { k: 'n', l: 'Name', v: k => R(k).n, h: k => link(k) },
      { k: 'd', l: 'Effect', h: k => { const d = R(k).d; return bonusesHtml(d.Bonuses) || (d.Description ? `<span class="sub">${esc(String(d.Description).slice(0, 180))}</span>` : ''); } },
    ], recsOf(extra), { sort: 'lvl' });
  }
  if (rates.length) h += `<h3>Fastest route to 99</h3><p class="note">From ${SKILLS.length ? 'your level' : 'level 1'}, counting the time to gather ingredients. See the <a href="#/guide/skill/${skill}">${esc(skill)} training guide</a> or the <a href="#/plan/skill/${skill}/99">planner</a> for other targets.</p>` + levelPlanHtml(skill, 99, SKILLS.length ? undefined : 1);
  if (rates.length) h += `<h3>Level calculator</h3>` + levelCalc(skill).replace(/^<h4>[^<]*<\/h4>/, '');

  // Gear summary
  if (slots.length) {
    const byType = {};
    for (const [k, r] of Object.entries(DB.records)) { const t = r.t === 'Item' && r.d.Capabilities?.['MelvorBase:Toolbelt']; if (t?.FitsInSlot && bare(t.FitsInSlot).startsWith(skill)) (byType[bare(t.FitsInSlot)] ||= []).push(k); }
    h += `<h3>Gear</h3><p>${esc(skill)} has its own toolbelt. The table lists each slot and what fits in it; the <a href="#/gear/${skill}">${esc(skill)} gear page</a> shows every item with its exact bonuses.</p>` +
      `<table class="wide"><tr><th>Slot</th><th>Items</th><th>Unlock</th></tr>${slots.sort((a, b) => R(a).n.localeCompare(R(b).n)).map(k => { const s = R(k), items = byType[bare(s.d.FitsType)] || [];
        return `<tr><td>${esc(s.n.replace(skill + ' ', ''))}</td><td>${items.length ? items.slice(0, 8).map(link).join(', ') + (items.length > 8 ? ` <span class="muted">+${items.length - 8} more</span>` : '') : '<span class="muted">none</span>'}</td><td class="sub">${s.d.UnlockRequirements?.length ? reqText(s.d.UnlockRequirements) : 'always'}</td></tr>`; }).join('')}</table>`;
  }

  // Shop upgrades for this skill
  const shop = recsOf('ShopPurchase', r => r.o === skill);
  if (shop.length) h += `<h3>Shop upgrades</h3>` + dataTable('shop_' + skill, [
    { k: 'lvl', l: 'Lvl', num: 1, v: k => lvlFor(R(k), skill) },
    { k: 'name', l: 'Upgrade', v: k => R(k).n, h: k => link(k) },
    { k: 'cost', l: 'Cost', num: 1, v: k => (R(k).d.Costs?.Currencies || []).reduce((s, c) => s + c.Quantity, 0), h: k => costText(R(k).d.Costs) },
    { k: 'gives', l: 'Gives', h: k => bonusesHtml(R(k).d.Provides?.Bonuses) + (R(k).d.Provides?.Items || []).map(i => `${fmt(i.Quantity)} ${linkRef(i.Item, 'Item')}`).join(', ') },
  ], shop, { sort: 'lvl' });

  // Mastery guild
  const ranks = keysFromConfig(skill, 'MasteryGuildRanks', 'MasteryGuildRank'), tasks = keysFromConfig(skill, 'MasteryGuildTasks', 'MasteryGuildTask'), bonuses = keysFromConfig(skill, 'MasteryGuildBonuses', 'MasteryGuildBonus');
  if (ranks.length || tasks.length) {
    const bonusFor = rk => bonuses.filter(b => (R(b).d.Requirements || []).some(q => bare(q.Data?.Rank) === R(rk).id));
    h += `<h3>Mastery guild</h3><p>Completing ${esc(skill)} tasks earns mastery points. Each rank needs a share of all the points available and unlocks a permanent bonus.</p>` +
      `<table><tr><th>Rank</th><th class="num">Points needed</th><th>Bonus</th></tr>${ranks.sort((a, b) => R(a).d.PointPercentRequired - R(b).d.PointPercentRequired).map(rk => `<tr><td>${esc(R(rk).n)}</td><td class="num">${pct(R(rk).d.PointPercentRequired)}</td><td>${bonusFor(rk).map(b => bonusesHtml(R(b).d.Rewards?.Bonuses)).join('') || '<span class="muted">none</span>'}</td></tr>`).join('')}</table>`;
    const cats = {};
    for (const k of tasks) (cats[bare(R(k).d.Category) || 'Other'] ||= []).push(k);
    const pts = c => R('MasteryGuildCategory:' + c)?.d.BasePoints;
    h += Object.entries(cats).sort((a, b) => (pts(a[0]) ?? 99) - (pts(b[0]) ?? 99)).map(([c, list]) => `<details><summary>${esc(c)} tasks (${list.length})${pts(c) ? ` · ${pts(c)} points each` : ''}</summary><table class="wide">${list.map(k => `<tr><td>${taskText(R(k))}</td></tr>`).join('')}</table></details>`).join('');
  }
  if (pets.length) h += `<h3>Pet</h3><table><tr><th>Pet</th><th>How to get it</th><th>Bonus</th></tr>${pets.map(k => `<tr><td>${link(k)}</td><td>${petHow(R(k))}</td><td>${bonusesHtml(R(k).d.Bonuses)}</td></tr>`).join('')}</table>`;
  return h;
}

// ---- items ----
const ITEM_CATS = [['all', 'All'], ['equipment', 'Armour'], ['weapons', 'Weapons'], ['toolbelt', 'Skill gear'], ['potions', 'Potions'], ['food', 'Food'], ['containers', 'Containers'], ['traps', 'Traps'], ['materials', 'Materials']];
function itemCat(d) {
  const c = d.Capabilities || {}, tool = c['MelvorBase:Toolbelt'];
  if (c['MelvorBase:Weapon']) return 'weapons';
  if (c['MelvorBase:Equipment']) return 'equipment';
  if (tool) return /Potion$/.test(bare(tool.FitsInSlot)) ? 'potions' : 'toolbelt';
  if (c['MelvorBase:Food']) return 'food';
  if (c['MelvorBase:Openable']) return 'containers';
  if (c['MelvorBase:HuntingTrap']) return 'traps';
  return 'materials';
}
function pageItems(cat = 'all') {
  const keys = recsOf('Item', r => cat === 'all' || itemCat(r.d) === cat);
  const label = ITEM_CATS.find(c => c[0] === cat)?.[1] || 'All';
  return `<h2>Items</h2><p class="lead">${DB.types.Item.toLocaleString()} items in the game. Pick a category, filter by name, or click a column to sort.</p>` + chips('#/items/', ITEM_CATS, cat) +
    `<h3>${esc(label)} (${keys.length.toLocaleString()})</h3>` + filterBox('items') + dataTable('items', [
      { k: 'n', l: 'Item', v: k => R(k).n, h: k => link(k) },
      { k: 'kind', l: 'Type', v: k => itemSlotLabel(R(k).d), h: k => `<span class="muted">${esc(itemSlotLabel(R(k).d))}</span>` },
      { k: 'sell', l: 'Sells for', num: 1, v: k => R(k).d.SellsFor?.Quantity ?? 0 },
      { k: 'src', l: 'Sources', num: 1, v: k => DB.itemRel[R(k).id]?.sources.length ?? 0 },
      { k: 'use', l: 'Used in', num: 1, v: k => DB.itemRel[R(k).id]?.uses.length ?? 0 },
    ], keys);
}
function itemSlotLabel(d) {
  const c = d.Capabilities || {};
  const eq = c['MelvorBase:Equipment'], tool = c['MelvorBase:Toolbelt'], w = c['MelvorBase:Weapon'];
  if (w) return words(bare(w.Type || 'Weapon'));
  if (eq) return words(bare(eq.Type));
  if (tool) return words(bare(tool.FitsInSlot));
  if (c['MelvorBase:Food']) return 'Food';
  if (c['MelvorBase:Openable']) return 'Container';
  if (c['MelvorBase:HuntingTrap']) return 'Trap';
  return (d.BankTags || []).map(t => words(bare(t.BankTag)))[0] || 'Material';
}

// ---- equipment ----
function pageEquipment(slot) {
  const eqs = recsOf('Item', r => r.d.Capabilities?.['MelvorBase:Equipment']);
  const slots = [...new Set(eqs.map(k => bare(R(k).d.Capabilities['MelvorBase:Equipment'].Type)))].sort();
  slot = slot || slots[0];
  const keys = eqs.filter(k => bare(R(k).d.Capabilities['MelvorBase:Equipment'].Type) === slot);
  const statOf = (k, name) => (R(k).d.Capabilities['MelvorBase:Equipment'].Stats?.Stats || []).find(s => bare(s.Stat) === name)?.Value ?? 0;
  const statNames = [...new Set(keys.flatMap(k => (R(k).d.Capabilities['MelvorBase:Equipment'].Stats?.Stats || []).map(s => bare(s.Stat))))];
  const top = statNames.map(s => [s, keys.filter(k => statOf(k, s)).length]).sort((a, b) => b[1] - a[1]).slice(0, 5).map(x => x[0]);
  const req = k => { const q = (R(k).d.Capabilities['MelvorBase:Equipment'].Requirements || []).find(q => bare(q.Type) === 'Level'); return q ? q.Data.Level : 0; };
  return `<h2>Equipment</h2><p class="lead">Combat equipment by slot, with level requirements and the main stats for that slot. Click an item for every stat and bonus.</p>` +
    chips('#/equipment/', slots.map(s => [s, words(s)]), slot) + `<h3>${esc(words(slot))} (${keys.length})</h3>` + filterBox('eq_' + slot) + dataTable('eq_' + slot, [
      { k: 'n', l: 'Item', v: k => R(k).n, h: k => link(k) },
      { k: 'req', l: 'Level', num: 1, v: req, h: k => { const q = (R(k).d.Capabilities['MelvorBase:Equipment'].Requirements || [])[0]; return q ? `${fmt(q.Data?.Level ?? '')} <span class="sub">${esc(bare(q.Data?.Component?.Entity || ''))}</span>` : ''; } },
      ...top.map(s => ({ k: s, l: statName(s), num: 1, v: k => statOf(k, s) })),
      { k: 'sell', l: 'Sells', num: 1, v: k => R(k).d.SellsFor?.Quantity ?? 0 },
      { k: 'cmp', l: '', h: k => `<a href="${compareAddHref(k)}" class="sub">compare</a>` },
    ], keys, { sort: 'req' });
}

// ---- monsters and areas ----
function areaEnemies(r) {
  const out = [];
  for (const e of r.d.Enemies || []) {
    if (typeof e === 'string') out.push(e);
    else if (e?.Enemies) for (const x of e.Enemies) out.push(typeof x === 'string' ? x : x.Enemy);
    else if (e?.Enemy) out.push(e.Enemy);
  }
  return [...new Set(out.filter(Boolean).map(x => refKey(x, 'Enemy')).filter(k => k?.startsWith('Enemy:')))];
}
function monsterTable(id, keys) {
  const L = (k, s) => (R(k).d.Levels || []).find(x => bare(x.Key) === s)?.Value ?? 0;
  return dataTable(id, [
    { k: 'n', l: 'Monster', v: k => R(k).n, h: k => link(k) },
    ...[['Hitpoints', 'HP'], ['Attack', 'Atk'], ['Strength', 'Str'], ['Defence', 'Def'], ['Ranged', 'Rng'], ['Magic', 'Mag']].map(([s, l]) => ({ k: s, l, num: 1, v: k => L(k, s) })),
    { k: 'dt', l: 'Damage', v: k => words(bare(R(k).d.DamageType || '')).replace(/ Damage$/, '') },
    { k: 'val', l: 'Gold/kill', num: 1, v: k => Math.round(enemyValue(R(k).d.Drops)) },
  ], keys, { sort: 'Hitpoints' });
}
function pageMonsters() {
  const areas = [...recsOf('CombatArea'), ...recsOf('Dungeon')];
  const byCat = {};
  for (const k of areas) (byCat[words(bare(R(k).d.Category || (R(k).t === 'Dungeon' ? 'Dungeons' : 'Areas')))] ||= []).push(k);
  const seen = new Set(areas.flatMap(k => areaEnemies(R(k))));
  const rest = recsOf('Enemy', r => !seen.has('Enemy:' + r.id));
  let h = `<h2>Monsters and combat areas</h2><p class="lead">${DB.types.Enemy} monsters across ${areas.length} combat areas and dungeons. Each area lists its monsters with their levels and what a kill is worth in coins and drops.</p>`;
  for (const [c, list] of Object.entries(byCat)) {
    h += `<h3 id="cat-${c.replace(/\W/g, '')}">${esc(c)}</h3>`;
    for (const k of list.sort((a, b) => (areaEnemies(R(a)).map(e => (R(e).d.Levels || [])[0]?.Value || 0).sort((x, y) => x - y)[0] || 0) - (areaEnemies(R(b)).map(e => (R(e).d.Levels || [])[0]?.Value || 0).sort((x, y) => x - y)[0] || 0))) {
      const r = R(k), en = areaEnemies(r);
      if (!en.length) continue;
      h += `<h4>${link(k)} <span class="sub">${esc(words(bare(r.d.Difficulty || '')))}${r.d.Darkness ? ' · darkness ' + r.d.Darkness : ''}${(r.d.UnlockRequirements || []).length ? ' · needs ' + reqText(r.d.UnlockRequirements).replace(/<br>/g, '; ') : ''}</span></h4>` + (en.length ? monsterTable('area_' + r.id, en) : '<p class="muted">No monsters listed.</p>');
    }
  }
  if (rest.length) h += `<h3>Other monsters</h3><p class="note">Quest and event monsters that aren't in a regular area.</p>` + monsterTable('area_rest', rest);
  return h;
}

// ---- shop ----
function pageShop() {
  const subs = {};

  const cats = {};
  for (const s of Object.keys(subs)) { const sr = R('ShopSubcategory:' + s); (cats[sr ? bare(sr.d.Category) : 'Other'] ||= []).push(s); }
  let h = `<h2>Shop</h2><p class="lead">All ${DB.types.ShopPurchase} shop purchases, grouped the way the game groups them, with costs, requirements and what each one gives.</p>`;
  for (const [c, list] of Object.entries(cats)) {
    h += `<h3 id="shop-${c}">${esc(R('ShopCategory:' + c)?.n || words(c))}</h3>`;
    for (const s of list) h += `<h4>${esc(R('ShopSubcategory:' + s)?.n || words(s))}</h4>` + dataTable('shop_' + s, [
      { k: 'n', l: 'Purchase', v: k => R(k).n, h: k => link(k) },
      { k: 'cost', l: 'Cost', num: 1, v: k => (R(k).d.Costs?.Currencies || []).reduce((a, x) => a + x.Quantity, 0), h: k => costText(R(k).d.Costs) },
      { k: 'req', l: 'Requires', h: k => `<span class="sub">${reqText(R(k).d.Requirements) || '-'}</span>` },
      { k: 'gives', l: 'Gives', h: k => bonusesHtml(R(k).d.Provides?.Bonuses) + (R(k).d.Provides?.Items || []).map(i => `${fmt(i.Quantity)} ${linkRef(i.Item, 'Item')}`).join(', ') || `<span class="sub">${esc(R(k).d.Description || '')}</span>` },

}

// ---- money making, XP table ----
function pageMoney(skill = 'all') {
  const all = Object.entries(DB.rates || {}).filter(([, x]) => x.area !== 'Quests' && (skill === 'all' || x.skill === skill));
  const skills = [...new Set(Object.values(DB.rates || {}).map(x => x.skill))].sort();
  const lvl = +(window._moneyLvl || 120);
  const PR = Object.fromEntries(planRates().map(r => [r.id, r])), SG = {};
  for (const [id] of all) SG[id] = PR[id] ? selfGp(PR[id], {}) : null;
  return `<h2>Money making</h2><p class="lead">Every skilling action ranked by gold per hour at base rates (no gear, upgrades or mastery). The first column is gold per hour of your own time when you gather the ingredients yourself; the second treats ingredients as bought or already owned, valued at their sell price. Combat is on the <a href="#/monsters">monster pages</a> (gold per kill).</p>` +
    chips('#/money/', [['all', 'All skills'], ...skills.map(s => [s, s])], skill) +
    `<p>Only show actions up to level <input id="moneyLvl" type="number" min="1" max="120" value="${lvl}" style="width:70px"></p>` + filterBox('money') + dataTable('money', [
      { k: 'name', l: 'Action', v: ([, x]) => x.name, h: ([id, x]) => { const rk = Object.keys(DB.records).find(k => DB.records[k].id === id.split(':').slice(1).join(':') && DB.records[k].o === x.skill); return `${rk ? link(rk) : esc(x.name)}${x.gate ? ` <span class="chip">needs ${gateText(x.gate)}</span>` : ''}${x.area ? `<div class="sub">${esc(x.area)}</div>` : ''}`; } },
      { k: 'skill', l: 'Skill', v: ([, x]) => x.skill, h: ([, x]) => skillLink(x.skill) },
      { k: 'level', l: 'Lvl', num: 1, v: ([, x]) => x.level },
      { k: 'self', l: 'Gold/hr, own ingredients', num: 1, v: ([id]) => SG[id] ?? -1e12, h: ([id]) => SG[id] == null ? '<span class="sub">no source</span>' : `<span class="gold">${fmt(Math.round(SG[id]))}</span>` },
      { k: 'gp', l: 'Gold/hr, ingredients bought', num: 1, v: ([, x]) => x.gp, h: ([, x]) => `<span class="${x.gp < 0 ? 'bad' : ''}">${fmt(x.gp)}</span>` },
      { k: 'xp', l: 'XP/hr', num: 1, v: ([, x]) => x.xp },
      { k: 'needs', l: 'Needs', h: ([, x]) => `<span class="sub">${esc(x.needs.join(', '))}</span>` },

function pageXp() {
  const t = DB.xpTable || [];
  const rows = [];
  for (let L = 2; L < t.length; L++) rows.push(`<tr><td class="num">${L}</td><td class="num">${fmt(t[L])}</td><td class="num">${fmt(t[L] - t[L - 1])}</td></tr>`);
  return `<h2>Experience table</h2><p class="lead">XP needed for every level from 1 to ${t.length - 1}. Level 99 takes ${fmt(t[99] || 0)} XP, the same curve as Melvor Idle 1.</p><div class="twocol">${[0, 1].map(c => `<table><tr><th class="num">Level</th><th class="num">Total XP</th><th class="num">From previous</th></tr>${rows.slice(c * Math.ceil(rows.length / 2), (c + 1) * Math.ceil(rows.length / 2)).join('')}</table>`).join('')}</div>`;
}

// ---- generic list page (rarely needed now) ----
function pageType(t) {
