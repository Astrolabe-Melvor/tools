  return `<h2>${esc(typeName(t))}</h2>` + crumbs(['<a href="#/data">All game data</a>']) + `<p class="lead">${keys.length.toLocaleString()} ${esc(typeName(t).toLowerCase())}.</p>` + filterBox('type_' + t) + dataTable('type_' + t, [
    { k: 'n', l: 'Name', v: k => R(k).n, h: k => link(k) },
    { k: 'skill', l: 'Skill', v: k => R(k).o || '', h: k => R(k).o ? skillLink(R(k).o) : '' },
    { k: 'd', l: 'Details', h: k => { const d = R(k).d; return d.Bonuses ? bonusesHtml(d.Bonuses) : d.Description ? `<span class="sub">${esc(String(d.Description).slice(0, 160))}</span>` : ''; } },
  ], keys);
}


// =====================================================================
// Planner: fastest way to get an item, fastest way to level, guides
// =====================================================================
// Everything is measured in hours of active play. Actions use base rates (public wiki) or your own rates with gear,
// upgrades and mastery when Astrolabe Tools is reading your save. Leveling picks the best XP/hr action at each level;
// "with gathering" also counts the time to gather an action's ingredients.
const PLAN = { lv: null, rates: null, costs: null, key: '' };
const MAXLV = 99;
const LV_STORE = 'mi2wiki.levels';
function planLevels() {
  if (SKILLS.length) return Object.fromEntries(SKILLS.map(s => [s.id, s.level]));
  if (!PLAN.lv) { try { PLAN.lv = JSON.parse(localStorage.getItem(LV_STORE) || 'null'); } catch {} }
  return PLAN.lv || {};
}
function setPlanLevel(sk, v) { const l = { ...planLevels(), [sk]: Math.max(1, Math.min(MAXLV, +v || 1)) }; PLAN.lv = l; try { localStorage.setItem(LV_STORE, JSON.stringify(l)); } catch {} PLAN.key = ''; }
const lvOf = (L, sk) => L[sk] ?? 1;
const owned = id => (BANK && BANK[id]) || 0;

function planRates() {
  if (!window.MI2_STATIC && BANK && !MONEY) loadPersonal();
  if (PLAN.rates && PLAN.rates.personal === !!MONEY) return PLAN.rates;
  const m = {};
  for (const [id, x] of Object.entries(DB.rates || {})) m[id] = { id, name: x.name, skill: x.skill, area: x.area, level: x.level, xp: x.xp, gp: x.gp, sec: x.sec, unit: x.unit, needs: x.needs || [], out: x.out, in: x.in, quest: x.area === 'Quests', gate: x.gate || null, sales: x.sales ?? x.gp };
  if (MONEY) for (const a of MONEY) {
    if (a.passive) continue;
    const b = m[a.id];
    if (a.skill === 'Combat' && !a.unlocked) continue;
    m[a.id] = { id: a.id, name: a.name, skill: a.skill, area: a.area, level: b?.level ?? 1, xp: a.xpPerHour, gp: a.gpPerHour, sales: a.sales ?? a.gpPerHour, sec: a.seconds, unit: a.unit, needs: b?.needs || [], out: a.outputs.map(o => [o.id, o.perHour]), in: a.inputs.map(i => [i.id, i.perHour]), quest: a.notes?.includes('quest only'), personal: true, combat: a.skill === 'Combat', gate: a.unlocked ? null : (b?.gate || null) };
  }
  // Bait is optional (it only speeds things up), so the planner doesn't make you produce it.
  for (const r of Object.values(m)) if (/^(Hunting|Fishing)$/.test(r.skill)) r.in = r.in.filter(([j]) => !/Bait$/.test(j));
  const list = Object.values(m).filter(r => !r.quest);
  list.personal = !!MONEY;
  return PLAN.rates = list;
}

// Extra sources that aren't timed actions: shop (gold), item upgrades, containers, farming plots.
function extraSources() {
  if (PLAN.extra) return PLAN.extra;
  const ex = [];
  for (const [k, r] of Object.entries(DB.records)) {
    if (r.t === 'ShopPurchase') for (const it of r.d.Provides?.Items || []) ex.push({ kind: 'shop', key: k, item: bare(it.Item), qty: it.Quantity || 1, gold: (r.d.Costs?.Currencies || []).filter(c => bare(c.Currency) === 'GoldPieces').reduce((s, c) => s + c.Quantity, 0), other: (r.d.Costs?.Currencies || []).some(c => bare(c.Currency) !== 'GoldPieces'), inputs: (r.d.Costs?.Items || []).map(i => [bare(i.Item), i.Quantity]), req: r.d.Requirements || [] });
    if (r.t === 'ItemUpgrade' && r.d.UpgradedItem) ex.push({ kind: 'upgrade', key: k, item: bare(r.d.UpgradedItem), qty: r.d.QuantityPerUpgrade || 1, gold: (r.d.Costs?.Currencies || []).reduce((s, c) => s + c.Quantity, 0), inputs: (r.d.Costs?.Items || []).map(i => [bare(i.Item), i.Quantity]), req: r.d.Requirements || [] });
    if (r.t === 'FarmingRecipe' && r.d.Product) ex.push({ kind: 'farm', key: k, item: bare(r.d.Product.Item), qty: r.d.Product.Quantity || 1, plots: Object.values(DB.records).filter(p => p.t === 'FarmingPlot' && p.d.Category === r.d.Category).length || 1, hours: (r.d.BaseInterval || 0) / 3.6e6, inputs: (r.d.Ingredients?.Items || []).map(i => [bare(i.Item), i.Quantity]), skill: 'Farming', level: levelReq(r, 'Farming') || 1 });
  }
  for (const [id, rel] of Object.entries(DB.itemRel)) for (const e of rel.sources) {
    const from = R(e.from);
    if (from?.t === 'Item' && (e.path === 'Opened' || e.path.startsWith('Capabilities'))) {
      const avg = ((e.min ?? 1) + (e.max ?? e.min ?? 1)) / 2 * (e.share ?? 1) * (e.chance ?? 1);
      if (avg > 0) ex.push({ kind: 'open', key: e.from, item: id, qty: avg, inputs: [[from.id, 1]] });
    }
  }
  return PLAN.extra = ex;
}

// Hours per unit of every item, given levels (or ignoring levels when any = true).
function unitCosts(L, any) {
  const rates = planRates(), ex = extraSources();
  const cost = {}, via = {};
  const bestGold = Math.max(1000, ...rates.filter(r => !r.combat && (any || r.level <= lvOf(L, r.skill))).map(r => r.gp || 0));
  for (let pass = 0; pass < 10; pass++) {
    let changed = false;
    const offer = (item, h, src) => { if (h > 0 && isFinite(h) && h < (cost[item] ?? Infinity) - 1e-12) { cost[item] = h; via[item] = src; changed = true; } };
    const inCost = ins => ins.reduce((s, [j, n]) => s + n * (cost[j] ?? Infinity), 0);
    for (const r of rates) {
      if (!any && r.level > lvOf(L, r.skill)) continue;
      const ic = inCost(r.in);
      if (!isFinite(ic)) continue;
      for (const [i, o] of r.out) if (o > 0) offer(i, (1 + ic) / o, { kind: 'action', r });
    }
    for (const e of ex) {
      if (e.kind === 'farm' && !any && e.level > lvOf(L, 'Farming')) continue;
      const ic = inCost(e.inputs);
      if (!isFinite(ic)) continue;
      const base = e.kind === 'shop' ? (e.other ? Infinity : e.gold / bestGold) : e.kind === 'upgrade' ? e.gold / bestGold : e.kind === 'farm' ? e.hours / e.plots : 0;
      offer(e.item, (base + ic) / e.qty, { kind: e.kind, e });
    }
    if (!changed) break;
  }
  return { cost, via, bestGold };
}
function costsFor(L) {
  const key = JSON.stringify(L) + '|' + !!MONEY;
  if (PLAN.key !== key) { PLAN.key = key; PLAN.costs = { now: unitCosts(L, false), any: unitCosts(L, true) }; PLAN.lvCache = {}; }
  return PLAN.costs;
}

// Fastest leveling: at each level, the action with the best effective XP/hr.
// Astrology gates: a major node (needs the constellation's level and 4 minor nodes' worth of knowledge) or an
// observation (a rare roll while studying the constellation).
const gateKey = g => g ? (g.node || g.obs) : '';
function gateDone(g) {
  if (!g) return true;
  if (g.node && ASTRO) return Object.values(ASTRO).some(c => c.major?.includes(g.node));
  return false;
}
function gateInfo(g) {
  const A = DB.astro; if (!A || !g) return null;
  const con = g.node ? A.cons.find(c => c.majors.some(n => n.id === g.node)) : A.cons.find(c => c.observations.some(o => o.id === g.obs));
  if (!con) return null;
  const node = g.node && con.majors.find(n => n.id === g.node);
  return { con, label: g.node ? `${con.name} ${node?.name || g.node}` : `${con.name} observation`, chance: g.obs ? A.obsChance[g.obs] : null };
}
function gateHours(g, L) {
  if (gateDone(g)) return 0;
  const gi = gateInfo(g); if (!gi) return Infinity;
  const c = gi.con, studiesPerHour = 3600000 / c.interval;
  const lv = levelHours('Astrology', lvOf(L, 'Astrology'), c.level, L);
  if (g.node) { let h = 0, k = ASTRO?.[c.id]?.knowledge || 0; for (let i = 0; i < c.perMajor; i++) { const need = c.thresholds[i] - k; if (need > 0) { h += need / (studiesPerHour * c.knowledge * (1 + 0.02 * i)); k = c.thresholds[i]; } } return lv + h; }
  return lv + 1 / (gi.chance * studiesPerHour);
}
function gateText(g) { const gi = gateInfo(g); return gi ? `${g.node ? 'unlock' : 'see'} <a href="#/r/AstrologyConstellation:${gi.con.id}">${esc(gi.label)}</a> in ${skillLink('Astrology')}` : ''; }
function levelPlan(skill, from, to, L, chain) {
  // Try without astrology gates, then with each gate opened (paying its cost once), keep the fastest.
  const gates = [...new Set(planRates().filter(r => r.skill === skill && r.gate && !gateDone(r.gate)).map(r => JSON.stringify(r.gate)))].map(x => JSON.parse(x));
  let best = levelPlanOpen(skill, from, to, L, chain, new Set());
  if (skill !== 'Astrology') for (const g of gates) {
    const gh = gateHours(g, L);
    if (!isFinite(gh) || gh >= best.hours) continue;
    const p = levelPlanOpen(skill, from, to, L, chain, new Set([gateKey(g)]));
    if (p.hours + gh < best.hours) best = { ...p, hours: p.hours + gh, gate: g, gateH: gh };
  }
  return best;
}
function levelPlanOpen(skill, from, to, L, chain, open) {
  const t = DB.xpTable, C = costsFor(L);
  const acts = planRates().filter(r => r.skill === skill && r.xp > 0 && !r.combat && (!r.gate || gateDone(r.gate) || open.has(gateKey(r.gate))));
  const eff = r => { if (!chain || !r.in.length) return r.xp; const ic = r.in.reduce((s, [j, n]) => s + n * Math.max(0, (C.now.cost[j] ?? C.any.cost[j] ?? Infinity)), 0); return isFinite(ic) ? r.xp / (1 + ic) : 0; };
  const segs = [];
  let hours = 0;
  for (let l = Math.max(1, from); l < to; l++) {
    const best = acts.filter(r => r.level <= l).map(r => ({ r, x: eff(r) })).filter(x => x.x > 0).sort((a, b) => b.x - a.x)[0];
    if (!best) return { segs, hours: Infinity, stuck: l };
    const h = (t[l + 1] - t[l]) / best.x;
    hours += h;
    const last = segs[segs.length - 1];
    if (last && last.r === best.r) { last.to = l + 1; last.hours += h; last.xpNeeded += t[l + 1] - t[l]; }
    else segs.push({ r: best.r, from: l, to: l + 1, hours: h, xph: best.x, xpNeeded: t[l + 1] - t[l] });
  }
  return { segs, hours };
}
function levelHours(skill, from, to, L) {
  if (to <= from) return 0;
  const k = skill + from + '-' + to;
  PLAN.lvCache ||= {};
  return PLAN.lvCache[k] ??= levelPlan(skill, from, to, L, true).hours;
}

// Fastest way to get qty of an item: pick the source with the lowest total (leveling + action time + inputs).
function planItem(id, qty, L, depth = 0, seen = new Set()) {
  const C = costsFor(L);
  const have = depth === 0 ? 0 : Math.min(owned(id), qty);
  const need = qty - have;
  const node = { id, qty, have, need, hours: 0, children: [], levels: {}, src: null };
  if (need <= 0 || depth > 7 || seen.has(id)) { node.src = need <= 0 ? { kind: 'bank' } : null; return node; }
  seen = new Set(seen).add(id);
  const cands = [];
  const inCost = ins => ins.reduce((s, [j, n]) => s + n * (C.now.cost[j] ?? C.any.cost[j] ?? Infinity), 0);
  for (const r of planRates()) {
    const o = r.out.find(x => x[0] === id)?.[1];
    if (!o) continue;
    const lvH = (r.combat ? 0 : levelHours(r.skill, lvOf(L, r.skill), r.level, L)) + (r.gate ? gateHours(r.gate, L) : 0);
    const total = lvH + need * (1 + inCost(r.in)) / o;
    if (isFinite(total)) cands.push({ kind: 'action', r, o, total, lvH, actH: need / o });
  }
  for (const e of extraSources().filter(e => e.item === id)) {
    if (e.kind === 'shop' && e.other) continue;
    const base = e.kind === 'shop' || e.kind === 'upgrade' ? e.gold / C.now.bestGold : e.kind === 'farm' ? e.hours / e.plots : 0;
    const lvH = e.kind === 'farm' ? levelHours('Farming', lvOf(L, 'Farming'), e.level, L) : 0;
    const total = lvH + need * (base + inCost(e.inputs)) / e.qty;
    if (isFinite(total)) cands.push({ kind: e.kind, e, total, lvH, actH: need * base / e.qty });
  }
  cands.sort((a, b) => a.total - b.total);
  const best = cands[0];
  node.alts = cands.slice(1, 4);
  if (!best) return node;
  node.src = best;
  node.hours = best.actH;
  const ins = best.kind === 'action' ? best.r.in.map(([j, n]) => [j, need * n / best.o]) : best.e.inputs.map(([j, n]) => [j, need * n / best.e.qty]);
  if (best.kind === 'action' && !best.r.combat && best.r.level > lvOf(L, best.r.skill)) node.levels[best.r.skill] = best.r.level;
  if (best.kind === 'farm' && best.e.level > lvOf(L, 'Farming')) node.levels.Farming = best.e.level;
  for (const [j, n] of ins) {
    const ch = planItem(j, Math.ceil(n), L, depth + 1, seen);
    node.children.push(ch);
    node.hours += ch.hours;
    for (const [s, l] of Object.entries(ch.levels)) node.levels[s] = Math.max(node.levels[s] || 0, l);
  }
  return node;
}

// Gold per hour of total effort when you gather the ingredients yourself (sales over action + gathering time).
function selfGp(r, L) {
  if (!r.in.length) return r.gp;
  const C = costsFor(L || planLevels());
  const ic = r.in.reduce((s, [j, n]) => s + n * (C.any.cost[j] ?? Infinity), 0);
  return isFinite(ic) ? (r.sales ?? r.gp) / (1 + ic) : null;
}
// ---- rendering ----
const hrs = h => !isFinite(h) ? '<span class="bad">no known way</span>' : h < 1 / 60 ? '< 1 min' : h < 1 ? Math.round(h * 60) + ' min' : h < 100 ? h.toFixed(1) + ' hr' : Math.round(h).toLocaleString() + ' hr';
function srcText(s) {
  if (!s) return '<span class="bad">no source found in the game data</span>';
  if (s.kind === 'bank') return '<span class="good">already in your bank</span>';
  if (s.kind === 'action') { const r = s.r, rk = Object.keys(DB.records).find(k => DB.records[k].id === r.id.split(':').slice(1).join(':') && DB.records[k].o === r.skill);
    return `${r.combat ? 'Kill' : skillIcon(r.skill) + esc(r.skill) + ':'} ${rk ? link(rk) : esc(r.name)} <span class="sub">(${r.combat ? '' : 'level ' + r.level + ', '}${fmt(Math.round(s.o * 10) / 10)}/hr${r.personal ? ', your rate' : ''})</span>${r.gate && !gateDone(r.gate) ? ` <span class="chip">needs: ${gateText(r.gate)}</span>` : ''}`; }
  if (s.kind === 'shop') return `Buy ${link(s.e.key)} <span class="sub">(${fmt(s.e.gold)} gold)</span>`;
  if (s.kind === 'upgrade') return `Upgrade via ${link(s.e.key)}`;
  if (s.kind === 'farm') return `${skillIcon('Farming')}Farming: ${link(s.e.key)} <span class="sub">(${hrs(s.e.hours)} per harvest of ${s.e.qty}, counted as ${s.e.plots} plots growing at once)</span>`;
  if (s.kind === 'open') return `Open ${link(s.e.key)} <span class="sub">(about ${fmt(Math.round(s.e.qty * 1000) / 1000)} per open)</span>`;
  return '';
}
function dropSources(id, need) {
  return (DB.itemRel[id]?.sources || []).filter(e => e.from.startsWith('Enemy:')).map(e => { const per = ((e.min ?? 1) + (e.max ?? e.min ?? 1)) / 2 * (e.share ?? 1) * (e.chance ?? 1); return { k: e.from, kills: per > 0 ? Math.ceil(need / per) : Infinity }; }).sort((a, b) => a.kills - b.kills);
}
function planTree(n, depth = 0) {
  const name = link(itemKey(n.id));
  const amt = `${fmt(Math.ceil(n.qty))}${n.have ? ` <span class="good">(${fmt(n.have)} in bank)</span>` : ''}`;
  const noSrc = !n.src ? ((DB.itemRel[n.id]?.sources || []).length ? `<span class="sub">no timed route; it comes from ${[...new Set(DB.itemRel[n.id].sources.map(e => e.from))].slice(0, 3).map(link).join(', ')}</span>` : '<span class="bad">no source in the game data</span>') : '';
  return `<li><b>${amt}</b> ${name}: ${noSrc || srcText(n.src)}${n.src && n.src.kind !== 'bank' ? ` <span class="sub">· ${hrs(n.src.actH)}</span>` : ''}${n.children.length ? `<ul>${n.children.map(c => planTree(c, depth + 1)).join('')}</ul>` : ''}</li>`;
}
function levelsBox() {
  if (SKILLS.length) return `<p class="note">Using your levels, bank and rates from your save.</p>`;
  const L = planLevels(), all = SKILL_GROUPS.flatMap(g => g[1]);
  return `<details class="lvbox"><summary>Your levels (saved in this browser)</summary><div class="lvgrid">${all.map(sk => `<label>${skillIcon(sk)}${sk}<input type="number" min="1" max="99" value="${lvOf(L, sk)}" data-lv="${sk}"></label>`).join('')}</div></details>`;
}
function wireLevels() { document.querySelectorAll('input[data-lv]').forEach(i => i.onchange = () => { setPlanLevel(i.dataset.lv, i.value); route(true); }); }

function itemPlanHtml(id, qty, compact) {
  const L = planLevels();
  const p = planItem(id, qty, L);
  const lvls = Object.entries(p.levels);
  const lvH = lvls.reduce((s, [sk, l]) => s + levelHours(sk, lvOf(L, sk), l, L), 0);
  const total = p.hours + lvH;
  let h = `<div class="plan"><p><b>Estimated time: ${hrs(total)}</b>${lvH ? ` <span class="sub">(${hrs(lvH)} of leveling + ${hrs(p.hours)} of gathering and making)</span>` : ''}</p>`;
  if (lvls.length) h += `<p>Levels needed first: ${lvls.map(([sk, l]) => `<a href="#/plan/skill/${sk}/${l}">${skillIcon(sk)}${sk} ${lvOf(L, sk)} → ${l}</a> <span class="sub">(${hrs(levelHours(sk, lvOf(L, sk), l, L))})</span>`).join(', ')}</p>`;
  h += `<ul class="ptree">${planTree(p)}</ul>`;
  const code = courseCode(p);
  if (code) h += courseButtons(code, `Get ${R(itemKey(p.id))?.n || p.id}`);
  const drops = dropSources(id, qty).slice(0, 4);
  if (drops.length) h += `<p class="note">Monster drops${MONEY ? '' : ' (time depends on your combat stats)'}: ${drops.map(d => `${link(d.k)} about ${fmt(d.kills)} kill${d.kills === 1 ? '' : 's'}`).join(', ')}.</p>`;
  if (!compact && p.alts?.length) h += `<p class="note">Other options: ${p.alts.map(a => `${srcText(a)} (${hrs(a.total)})`).join('; ')}</p>`;
  return h + '</div>';
}

// A Course share code ("CRS1:" + base64 JSON) for a plan: level-ups first ("train the skill the fastest way"),
// then each action, ingredients before what they make, each until it has made the amount the plan needs.
function courseCode(p) {
  const steps = [], byAction = {};
  for (const [sk, l] of Object.entries(p.levels || {})) steps.push({ a: `${sk}:*best`, g: 'Level', n: l, s: sk });
  (function walk(n) {
    for (const c of n.children || []) walk(c);
    const src = n.src;
    if (!src || src.kind !== 'action' || src.r.combat || !(n.need > 0)) return;
    const k = src.r.id;
    if (byAction[k]) { byAction[k].n += Math.ceil(n.need); return; }
    steps.push(byAction[k] = { a: k, g: 'MoreItems', n: Math.ceil(n.need), i: n.id });
  })(p);
  if (!steps.some(x => x.g === 'MoreItems')) return '';
  return 'CRS1:' + btoa(unescape(encodeURIComponent(JSON.stringify({ lanes: 1, loop: false, steps }))));
}
// "Send to Course" (local tools only) drops the code in the mod's inbox; Course adds the steps within a few seconds.
function courseButtons(code, label) {
  return `<p class="course-send">${STATIC ? '' : `<button class="btn" data-aqsend="${esc(code)}" data-label="${esc(label)}">Send to Course</button> `}<button class="btn${STATIC ? '' : ' alt'}" data-aq="${esc(code)}">Copy for Course</button>
    <span class="sub">${STATIC ? 'Paste it in the game: Course (F6) &gt; Saved and shared &gt; Add steps from a pasted code.' : 'Send adds the steps to your queue in the running game (Course 0.9.2 or later). Copy gives a code to paste or share.'} Needs the Course mod.</span></p>`;
}
document.addEventListener('click', e => {
  const s = e.target.closest && e.target.closest('[data-aqsend]');
  if (s) {
    s.disabled = true; s.textContent = 'Sending...';
    fetch('/api/course/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Astrolabe': '1' }, body: JSON.stringify({ code: s.dataset.aqsend, label: s.dataset.label }) })
      .then(r => r.json()).then(r => { if (r.error) throw new Error(r.error); s.textContent = 'Sent: check Course (F6)'; })
      .catch(err => { s.disabled = false; s.textContent = 'Send to Course'; alert("Couldn't send: " + err.message); });
    return;
  }
  const b = e.target.closest && e.target.closest('[data-aq]');
  if (!b) return;
  navigator.clipboard.writeText(b.dataset.aq).then(() => { b.textContent = 'Copied: paste it in the game'; }, () => { prompt('Copy this code:', b.dataset.aq); });
});

function pagePlan(kind, a, b) {

    const gates = DB.astro.gates?.[n.id] || [];
    const box = $('astroPick'); box.hidden = false;
    box.innerHTML = `<button class="x" type="button" aria-label="Close">×</button><b>${esc(c.name)}: ${major ? esc(n.name) : 'Minor ' + esc(n.name)}</b> <span class="sub">${major ? 'major node' : 'minor node'}</span>${nodeBonus(n)}<div class="sub">Needs: ${nodeReq(n)}</div>${gates.length ? `<div class="good">Unlocks ${gates.map(link).join(', ')}</div>` : ''}<div class="sub"><a href="#/r/AstrologyConstellation:${c.id}">${esc(c.name)} page</a></div>`;
    box.querySelector('.x').onclick = () => { box.hidden = true; g.classList.remove('sel'); };
    document.querySelectorAll('.star.sel').forEach(x => x.classList.remove('sel')); g.classList.add('sel');
    if (box.getBoundingClientRect().top > innerHeight) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  document.querySelectorAll('.star').forEach(g => { g.onclick = () => show(g); g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(g); } }; });
}

// ---------- game changes ----------
let CHANGES = null;
function loadChanges() {
  if (CHANGES) return;
  CHANGES = 'loading';
  fetch(STATIC ? 'changes.json' : '/changes.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(x => { CHANGES = Array.isArray(x) ? x : []; if (location.hash.startsWith('#/changes')) route(true); });
}
function pageChanges(arg) {
  loadChanges();
  let h = `<h2>Game changes</h2><p class="lead">What changed in the game data between wiki builds: new and removed items, monsters, actions and everything else, plus every changed number. A new entry appears whenever the wiki is rebuilt after a game update.</p>`;
  if (CHANGES === 'loading' || !CHANGES) return h + '<p class="muted">Loading...</p>';
  if (!CHANGES.length) return h + `<p class="muted">No changes recorded yet. The first entry appears after the next game update${DB.gameVersion ? ` (this build is ${esc(DB.gameVersion)})` : ''}.</p>`;
  const i = Math.max(0, Math.min(CHANGES.length - 1, +(arg || 0) || 0)), c = CHANGES[i];
  const label = x => `${x.from === x.to ? esc(x.to) + ' (data update)' : `${esc(x.from || '?')} to ${esc(x.to)}`}, ${esc(x.built)}`;
  if (CHANGES.length > 1) h += `<div class="chips">${CHANGES.map((x, j) => `<a href="#/changes/${j}" class="${j === i ? 'on' : ''}">${label(x)}</a>`).join('')}</div>`;
  const nameOf = x => R(x.k) ? link(x.k) : esc(x.n);
  const byType = list => { const m = new Map(); for (const x of list) (m.get(x.t) || m.set(x.t, []).get(x.t)).push(x); return [...m].sort((a, b) => b[1].length - a[1].length); };
  h += `<p>${label(c)}: <b class="good">${c.add.length} added</b>, <b class="bad">${c.rem.length} removed</b>, <b class="gold">${c.chg.length} changed</b>.</p>`;
  if (c.add.length) h += `<h3>Added</h3>` + byType(c.add).map(([t, l]) => `<h4>${esc(typeName(t))} (${l.length})</h4><ul class="linklist">${l.map(x => `<li>${nameOf(x)}</li>`).join('')}</ul>`).join('');
  if (c.rem.length) h += `<h3>Removed</h3>` + byType(c.rem).map(([t, l]) => `<h4>${esc(typeName(t))} (${l.length})</h4><ul class="linklist">${l.map(x => `<li>${esc(x.n)}</li>`).join('')}</ul>`).join('');
  const val = (v, cls) => v == null ? '<span class="muted">none</span>' : `<span class="${cls}">${esc(v)}</span>`;
  if (c.chg.length) h += `<h3>Changed</h3>` + filterBox('chg', 'Filter by name or field...') + `<table class="wide chg"><thead><tr><th>What</th><th>Changes (was → now)</th></tr></thead><tbody>${c.chg.map(x => `<tr><td>${nameOf(x)}<div class="sub">${esc(ONE[x.t] || words(x.t))}</div></td><td>${x.f.map(f => `<div><span class="sub">${esc(f.p)}</span> ${val(f.a, 'bad')} → ${val(f.b, 'good')}</div>`).join('')}${x.more ? `<div class="sub">and ${x.more} more fields</div>` : ''}</td></tr>`).join('')}</tbody></table>`;
  return h;
}

// ---------- mods (Astrolabe Loader) ----------
const MOD_REPO = 'Astrolabe-Melvor/loader';
const MODS = [
  ['Loader', 'F1', 'Runs the mods. Adds the Mods menu: each mod\'s window and key, update check and bug reports. Already using Melvor Mod Loader? Keep it; the mods run on either.'],
  ['Course', 'F6', 'Queue actions one after another: cut 500 logs, then burn them, then fight until level 40. Plans whole items, takes codes from this wiki\'s planner, and keeps going while the game is closed. A Queue button on every skill page.'],
  ['Logbook', 'F7', 'XP, items and gold gained this session, with rates per hour, rare drops and past sessions.'],
  ['Beacon', 'F8', 'Sounds, notes, taskbar flash or Discord messages when something needs you: level ups, pets, low food, a full bank, idling.'],
  ['Hold', 'F9', 'What your bank is worth. Sells what you don\'t need by your rules, buries and opens in one click, and buys shop upgrades when you can afford them.'],
  ['Spyglass', 'F10', 'Look up any item in game: where it comes from, what it is for, and plan it in Course.'],
  ['Anchor', 'F4', 'Save backups on a timer and before risky changes; restore any of them.'],
  ['Deckhand', 'F3', 'Ranching petting and repairs, keeping the grain mill running, and farming warnings.'],
];
let RELEASE = null;
function loadRelease() {
  if (RELEASE) return;
  RELEASE = 'loading';
  fetch(`https://api.github.com/repos/${MOD_REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' } })
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(x => { RELEASE = x || 'failed'; if (location.hash.startsWith('#/mods')) route(true); });
}
function pageMods() {
  loadRelease();
  const page = `https://github.com/${MOD_REPO}/releases/latest`;
  const assets = typeof RELEASE === 'object' && RELEASE ? RELEASE.assets || [] : [];
  const zip = name => assets.find(a => new RegExp(`^Astrolabe${name}-[\\d.]+\\.zip$`).test(a.name));
  const ver = a => a ? a.name.replace(/^Astrolabe\w+-|\.zip$/g, '') : '';
  const mb = a => a ? ` (${(a.size / 1048576).toFixed(a.size < 1048576 ? 2 : 1)} MB)` : '';
  const all = zip('All');
  let h = `<h2>Mods</h2><p class="lead">Astrolabe's own mods for Melvor Idle 2: a queue for your actions, session stats, alerts, bank rules, item lookup and save backups, all in windows drawn like the game's own. Unofficial; no game files are changed.</p>`;
  if (RELEASE === 'loading') h += '<p class="muted">Looking up the newest release...</p>';
  else if (!all) h += `<p>Download from <a href="${page}" target="_blank" rel="noopener">the release page on GitHub</a> or <a href="https://www.nexusmods.com/melvoridle2/mods/55" target="_blank" rel="noopener">Nexus Mods</a>.</p>`;
  else h += `<p class="course-send"><a class="btn" href="${esc(all.browser_download_url)}">Download everything${mb(all)}</a> <span class="muted">${esc(RELEASE.tag_name || '')}, ${esc((RELEASE.published_at || '').slice(0, 10))}. <a href="${page}" target="_blank" rel="noopener">Release notes</a>. Also on <a href="https://www.nexusmods.com/melvoridle2/mods/55" target="_blank" rel="noopener">Nexus Mods</a>.</span></p>`;
  h += `<h3>Install</h3><ol>
    <li>Close the game.</li>
    <li>Open the game folder: in Steam, right-click Melvor Idle 2, then Manage, then Browse local files.</li>
    <li>Extract the zip there, so <code>override.cfg</code> sits next to <code>Melvor2.exe</code>. Each mod lands in <code>mods\\&lt;Mod&gt;</code>.</li>
    <li>Start the game. A green Astrolabe tag shows top left; <b>F1</b> opens the Mods menu, and each mod window has a Help and a Tour button.</li>
  </ol>
  <p>To pick only some mods, download the Loader plus the ones you want below. Already using Melvor Mod Loader? Keep it and download only the mods: they run on either loader (install one loader, not both). To update, close the game and extract the new zips over the old ones; your settings are kept. The Mods menu tells you when there is an update.</p>`;
  h += `<h3>The mods</h3><table class="wide"><thead><tr><th>Mod</th><th>What it does</th><th>Key</th><th>Download</th></tr></thead><tbody>${MODS.map(([n, k, d]) => {
    const a = zip(n);
    return `<tr><td><b>${n}</b></td><td>${esc(d)}</td><td>${k}</td><td style="white-space:nowrap">${a ? `<a href="${esc(a.browser_download_url)}">${esc(ver(a))}</a> <span class="sub" style="display:inline">${mb(a).trim()}</span>` : `<a href="${page}" target="_blank" rel="noopener">release page</a>`}</td></tr>`;
  }).join('')}</tbody></table>`;
  h += `<h3>Problems</h3><ul>
    <li><b>Something isn't working:</b> in game, press <b>F1</b>, then <b>Report a bug</b>. It copies your versions and the log; paste it into <a href="https://github.com/${MOD_REPO}/issues/new" target="_blank" rel="noopener">a new issue</a>.</li>
    <li><b>The game won't start after a game update:</b> delete <code>override.cfg</code> from the game folder to play without mods, and wait for an updated loader.</li>
    <li><b>Removing:</b> delete <code>override.cfg</code> and the folder <code>data_MelvorModLoader_windows_x86_64</code>. The <code>mods</code> folder can stay.</li>
  </ul><p class="muted">Source and older versions: <a href="https://github.com/${MOD_REPO}" target="_blank" rel="noopener">github.com/${MOD_REPO}</a>. Not affiliated with Games by Malcs.</p>`;
  return h;
}

// ---- routing ----
function route(keepScroll) {
  const [, kind, ...rest] = decodeURIComponent(location.hash.slice(1) || '/').split('/');
  const arg = rest.join('/');
  const pages = { r: () => pageRecord(arg), skill: () => pageSkill(arg), skills: pageSkills, type: () => pageType(arg), gear: () => pageGear(arg), guide: () => rest[0] === 'skill' ? pageSkillGuide(rest[1]) : rest[0] === 'quests' ? pageQuestGuide() : rest[0] === 'completion' ? pageCompletion() : pageGuide(arg), data: pageData,
    items: () => pageItems(arg || 'all'), equipment: () => pageEquipment(arg), monsters: pageMonsters, areas: pageMonsters, shop: pageShop, quests: pageQuests, pets: pagePets, money: () => pageMoney(arg || 'all'), xp: pageXp, guides: pageGuides,
    plan: () => pagePlan(rest[0], rest[1], rest[2]), search: () => pageSearch(arg), compare: () => pageCompare(arg), calc: pageCalc, astrology: pageAstroMap, changes: () => pageChanges(arg), mods: pageMods };
  const html = (pages[kind] || pageHome)();
  if (!html) return;
  $('main').innerHTML = html;
  const t = $('main').querySelector(':scope > h2:first-child');
  if (t) { const h1 = document.createElement('h1'); h1.className = 'page-title'; h1.innerHTML = t.innerHTML; t.replaceWith(h1); }
  $('main').querySelectorAll(':scope > h3').forEach(h => { h.innerHTML = `<span class="tag">${h.innerHTML}</span>`; });
  if (kind) addToc(); markSide(); wireFilters(); document.body.classList.remove('menu');
  if (kind === 'skill') wireSkillPage(arg);
  if (kind === 'plan' || kind === 'guide') wirePlan();
  if (kind === 'compare') wireCompare();
  if (kind === 'calc') wireCalc();
  if (kind === 'astrology') wireAstroMap();
  hoverCard.hide();
  if ($('moneyLvl')) $('moneyLvl').onchange = () => { window._moneyLvl = $('moneyLvl').value; route(true); };
  const r = kind === 'r' && R(arg);
  const TITLES = { calc: 'Combat calculator', compare: 'Gear compare', astrology: 'Astrology map', changes: 'Game changes', search: 'Search', mods: 'Mods' };
  document.title = (r ? r.n + ' | ' : kind === 'skill' || kind === 'gear' ? arg + ' | ' : TITLES[kind] ? TITLES[kind] + ' | ' : '') + 'Astrolabe Wiki';
  if (keepScroll !== true) window.scrollTo(0, 0);
}

init();
</script>
